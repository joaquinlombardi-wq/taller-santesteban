        <div class="paso"><span class="num">3</span><b>Claude lo dibuja</b><p>Joaquín le escribe a Claude «hay pedidos en el taller». Mientras trabaja, el pedido dice «Claude lo está dibujando»; al terminar, las versiones aparecen en el Taller, en «Para revisar».</p></div>
      </div>`}
      ${nuevo}
      <div class="seccion"><span class="etiqueta">Pendientes · ${pend.length}</span>${pend.length ? `<div class="lista">${pend.map(fila).join("")}</div>` : `<div class="vacio">No hay pedidos esperando.</div>`}</div>
      <div class="seccion"><span class="etiqueta">Dibujados · ${hechos.length}</span>${hechos.length ? `<div class="lista">${hechos.map(fila).join("")}</div>` : `<div class="vacio">Todavía no hay pedidos dibujados.</div>`}</div>`;
  }

  // ---------- Equipo (solo en la versión web, para quien administra) ----------
  const ROLES = { admin: "Administración", diseno: "Diseño", lectura: "Solo mirar" };
  const ROLES_AYUDA = { admin: "usa todo el taller y suma personas", diseno: "usa todo el taller", lectura: "ve el taller, no cambia nada" };
  function vEquipo() {
    const web = window.tallerWeb;
    const yo = web.yo();
    const ms = web.miembros().sort((a, b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre, "es"));
    const opciones = (rol) => Object.entries(ROLES).map(([k, t]) => `<option value="${k}"${k === rol ? " selected" : ""}>${esc(t)}: ${esc(ROLES_AYUDA[k])}</option>`).join("");
    const fila = (m) => {
      const esYo = m.email === yo?.email;
      const estado = !m.activo ? "Sin acceso" : m.ultimo_ingreso ? `Entró por última vez el ${fecha(m.ultimo_ingreso)}` : "Todavía no entró";
      return `<li class="${m.activo ? "" : "inactivo"}">
        <div><b>${esc(m.nombre)}</b><small>${esc(m.email)}</small></div>
        <div class="rol">${esYo ? `<span>${esc(ROLES[m.rol] || m.rol)}</span>` : `<select data-rol="${esc(m.email)}" aria-label="Qué puede hacer ${esc(m.nombre)}"${m.activo ? "" : " disabled"}>${opciones(m.rol)}</select>`}<small>${esYo ? "Sos vos" : esc(estado)}</small></div>
        <div class="fila">${esYo ? "" : m.activo
          ? `<button class="btn chico" data-accion="avisoEquipo" data-id="${esc(m.email)}">Mensaje para avisarle</button><button class="btn chico no" data-accion="quitarAcceso" data-id="${esc(m.email)}">Quitar acceso</button>`
          : `<button class="btn chico" data-accion="devolverAcceso" data-id="${esc(m.email)}">Devolver acceso</button>`}</div>
      </li>`;
    };
    return `<div>
      <header class="cabeza"><h1>Equipo</h1><p>Quién puede entrar al taller. Nadie usa contraseña: cada persona entra con su mail y un código que le llega por correo. Para sumar a alguien, cargá su nombre y su mail, y avisale que ya puede entrar.</p></header>
      <section class="seccion"><span class="etiqueta">Personas · ${ms.filter((m) => m.activo).length}</span><ul class="equipo">${ms.map(fila).join("")}</ul></section>
      <section class="seccion"><span class="etiqueta">Sumar a alguien</span>
        <form class="sumar" data-form="sumar">
          <label>Nombre<input type="text" name="nombre" required maxlength="80" autocomplete="off"></label>
          <label>Mail<input type="email" name="email" required maxlength="200" autocomplete="off"></label>
          <label>Qué puede hacer<select name="rol">${opciones("diseno")}</select></label>
          <button class="btn prim" type="submit">Sumar al equipo</button>
        </form>
      </section>
    </div>`;
  }
  // Mensaje listo para mandar por WhatsApp o por mail
  function mostrarAviso(m, recien) {
    const texto = `Hola ${m.nombre.split(" ")[0]}! Ya tenés acceso al taller de diseño de Santesteban: ${window.tallerWeb.direccion()}\nEntrá con tu mail (${m.email}) y te llega un código para entrar. No hace falta contraseña.`;
    abrirVentana(`<div class="formulario">
      <h2>${recien ? `Listo: ${esc(m.nombre)} ya puede entrar` : `Avisale a ${esc(m.nombre)}`}</h2>
      <p>Mandale este mensaje por WhatsApp o por mail.</p>
      <textarea class="link-copiar" readonly rows="4" aria-label="Mensaje">${esc(texto)}</textarea>
      <div class="fila"><button class="btn prim" data-accion="copiarAviso">Copiar mensaje</button><button class="btn" data-accion="cerrar">Listo</button></div>
    </div>`, true);
  }

  // ---------- Ventanas ----------
  let ultimoFoco = null;
  function abrirVentana(html, chica = false) {
    if (!$("#velo").classList.contains("abierto")) ultimoFoco = document.activeElement;
    const w = $("#ventana");
    w.className = "ventana" + (chica ? " chica" : "");
    w.innerHTML = `<button class="cerrar" data-accion="cerrar" aria-label="Cerrar">×</button>` + html;
    $("#velo").classList.add("abierto");
    setTimeout(() => (w.querySelector("textarea, input[type='text'], select") || w.querySelector(".cerrar")).focus(), 30);
  }
  function cerrarVentana() {
    $("#velo").classList.remove("abierto");
    $("#ventana").innerHTML = "";
    ultimoFoco?.focus?.();
  }

  function linaje(v) {
    const cadena = [];
    let p = v.padre ? version(v.padre) : null;
    const vistos = new Set();
    while (p && !vistos.has(p.id) && cadena.length < 6) { vistos.add(p.id); cadena.push(p); p = p.padre ? version(p.padre) : null; }
    const hijas = S.versiones.filter((x) => x.padre === v.id);
    const link = (x) => `<a data-accion="abrir" data-id="${esc(x.id)}">${esc(x.nombre)}</a>`;
    let t = "";
    if (cadena.length) t += `Viene de ${cadena.map(link).join(" ← ")}. `;
    if (hijas.length) t += `Salieron de acá: ${hijas.map(link).join(", ")}.`;
    return t;
  }

  function abrirVersion(id) {
    const v = version(id);
    if (!v) return;
    const p = proyecto(v.proyecto);
    const decidido = v.estado !== "propuesta";
    const acciones = escribe() ? `<div class="acciones">
        ${decidido ? `<button class="btn" data-accion="decidir" data-id="${esc(v.id)}" data-estado="${esc(v.estado)}">Cambiar o explicar</button>`
          : `<button class="btn ok" data-accion="decidir" data-id="${esc(v.id)}" data-estado="guardada">Aceptar</button><button class="btn no" data-accion="decidir" data-id="${esc(v.id)}" data-estado="descartada">Rechazar</button>`}
        <button class="btn" data-accion="cambio" data-id="${esc(v.id)}">Pedir un cambio</button>
        ${S.downloads ? `<button class="btn" data-accion="descargar" data-id="${esc(v.id)}">Descargar</button>` : ""}
      </div>` : (S.downloads ? `<div class="acciones"><button class="btn" data-accion="descargar" data-id="${esc(v.id)}">Descargar</button></div>` : "");
    const lin = linaje(v);
    abrirVentana(`<div class="detalle" data-version="${esc(v.id)}">
      <div class="imagenes">
        <img id="imgDetalle" src="${foto(v.imagen)}" alt="${esc(v.nombre)}">
        ${p?.original ? `<div class="conmutador" role="group" aria-label="Qué imagen ver"><button data-accion="verImg" data-cual="version" aria-pressed="true">Diseño</button><button data-accion="verImg" data-cual="original" aria-pressed="false">Original</button></div>` : ""}
      </div>
      <div class="info">
        <div class="fila"><span class="chip ${esc(v.estado)}">${esc(ESTADO[v.estado] || v.estado)}</span>${v.ronda ? `<span class="chip">Ronda ${esc(v.ronda)}</span>` : ""}${v.temporada ? `<span class="chip ${claseTemp(v.temporada)}">${esc(v.temporada)}</span>` : ""}</div>
        <h2>${esc(v.nombre)}</h2>
        ${v.descripcion ? `<p class="desc">${esc(v.descripcion)}</p>` : ""}
        ${v.materiales?.length ? `<div class="fila">${v.materiales.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>` : ""}
        ${decidido && v.motivo ? `<p class="estado"><b>${v.estado === "descartada" ? "Por qué no" : "Por qué sí"}:</b> ${esc(v.motivo)}</p>` : ""}
        ${lin ? `<p class="linaje">${lin}</p>` : ""}
        <p class="estado">${esc(p?.nombre || "")} · ${esc(fecha(v.creado))}${v.autor ? ` · ${persona(v.autor)}` : ""}</p>
        ${acciones}
      </div></div>`);
    resolverNombres();
  }

  function abrirDecision(id, estado) {
    const v = version(id);
    if (!v) return;
    const p = proyecto(v.proyecto);
    const decidido = v.estado !== "propuesta";
    abrirVentana(`<form class="formulario" data-form="decidir" data-id="${esc(v.id)}">
      <div class="quien-decide">${v.imagen ? `<img src="${foto(v.imagen)}" alt="">` : "<span></span>"}<div><h2>${esc(v.nombre)}</h2><p>${esc(p?.nombre || "")}${v.ronda ? ` · ronda ${esc(v.ronda)}` : ""}</p></div></div>
      <div class="eleccion" role="radiogroup" aria-label="Decisión">
        <label class="opcion si"><input type="radio" name="estado" value="guardada" ${estado === "guardada" ? "checked" : ""} required> Aceptado</label>
        <label class="opcion no"><input type="radio" name="estado" value="descartada" ${estado === "descartada" ? "checked" : ""}> Rechazado</label>
      </div>
      <label><span id="etqPorque">${estado === "descartada" ? "¿Por qué no?" : "¿Por qué sí?"}</span><textarea name="texto" required maxlength="600" placeholder="${estado === "descartada" ? "Ej.: el herraje queda pegado encima, no se integra" : "Ej.: el chaguar queda integrado a la cartera"}">${esc(decidido ? v.motivo || "" : "")}</textarea></label>
      <p>Esta explicación pasa al cerebro de la diseñadora y ${AUTO ? "el dibujante automático" : "Claude"} la tiene en cuenta en las próximas versiones.</p>
      <div class="acciones"><button class="btn prim" type="submit">Guardar decisión</button><button class="btn" type="button" data-accion="cerrar">Cancelar</button>
        ${decidido && escribe() ? `<button class="btn" type="button" data-accion="volverARevisar" data-id="${esc(v.id)}">Volver a «para revisar»</button>` : ""}</div>
    </form>`, true);
  }

  function abrirCambio(id) {
    const v = version(id);
    if (!v) return;
    abrirVentana(`<form class="formulario" data-form="cambio" data-id="${esc(v.id)}">
      <h2>Pedir un cambio</h2>
      <p>Sobre «${esc(v.nombre)}». ${AUTO ? "El dibujante automático lo dibuja en uno o dos minutos; lo vas a ver en «Para revisar»." : "El pedido queda en «Pedidos de versiones» y Claude lo dibuja cuando Joaquín se lo pide en el chat."}</p>
      <label>¿Qué cambio querés?<textarea name="texto" required maxlength="800" placeholder="Ej.: la misma, pero con los dijes más grandes y en negro"></textarea></label>
      <div class="acciones"><button class="btn prim" type="submit">Enviar pedido</button><button class="btn" type="button" data-accion="cerrar">Cancelar</button></div>
    </form>`, true);
  }

  function abrirPedido(id) {
    const x = S.pedidos.find((y) => y.id === id);
    if (!x) return;
    const p = proyecto(x.proyecto);
    const v = x.version ? version(x.version) : null;
    const dibujando = x.estado === "en_proceso";
    abrirVentana(`<div class="formulario">
      <div class="fila"><span class="chip pendiente">${esc(estadoPedido(x))}</span></div>
      <h2>En producción</h2>
      <p>${esc(p?.nombre || "")}${v ? ` · sobre ${esc(v.nombre)}` : ""} · pedido el ${esc(fecha(x.creado))}${x.quien ? ` · ${persona(x.quien)}` : ""}</p>
      <p style="color:var(--tx);font-size:15px">${esc(x.texto)}</p>
      <p>${esc(explicaPedido(x))}</p>
      <div class="acciones">${AUTO && escribe() && (x.estado === "error" || x.estado === "en_cola") ? `<button class="btn prim" data-accion="reintentarPedido" data-id="${esc(x.id)}">Reintentar</button>` : ""}${escribe() ? `<button class="btn" data-accion="borrarPedido" data-id="${esc(x.id)}">Cancelar pedido</button>` : ""}<button class="btn" data-accion="cerrar">Cerrar</button></div>
    </div>`, true);
    resolverNombres();
  }

  function formularioModelo(p) {
    const nuevo = !p;
    abrirVentana(`<form class="formulario" data-form="modelo" ${p ? `data-id="${esc(p.id)}"` : ""}>
      <h2>${nuevo ? "Subir un modelo" : "Editar el modelo"}</h2>
      <p>${nuevo ? `La foto de una cartera para transformarla al estilo Santesteban. Al subirla, ${DIBUJA} dibuja solo las primeras versiones.` : `Estos datos los usa ${DIBUJA} para las próximas versiones.`}</p>
      ${nuevo ? `<label>Foto de la cartera<input type="file" name="archivo" accept="image/*" required></label>` : ""}
      <label>Nombre del modelo<input type="text" name="nombre" required maxlength="80" value="${esc(p?.nombre || "")}" placeholder="Ej.: Bandolera de flecos"></label>
      <label>Temporada<select name="temporada">${TEMPORADAS.map((t) => `<option ${(p?.temporada || "Invierno") === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Qué se conserva del original<input type="text" name="conservar" maxlength="200" value="${esc(p?.conservar || "Solo la forma y el tamaño")}"></label>
      <label>Notas para el diseño (opcional)<textarea name="notas" maxlength="800" placeholder="Ej.: probar con asta y chaguar; nada de motivos de mar">${esc(p?.notas || "")}</textarea></label>
      <div class="acciones"><button class="btn prim" type="submit">${nuevo ? "Subir y pedir versiones" : "Guardar cambios"}</button><button class="btn" type="button" data-accion="cerrar">Cancelar</button></div>
    </form>`, true);
  }

  function formularioPedido(p) {
    abrirVentana(`<form class="formulario" data-form="pedido">
      <h2>Pedir versiones nuevas</h2>
      <p>Para «${esc(p.nombre)}». Queda en «Pedidos de versiones»; ${DIBUJA} lo dibuja siguiendo el cerebro de la diseñadora.</p>
      <label>¿Qué querés ver?<textarea name="texto" required maxlength="800" placeholder="Ej.: dos versiones más en bordó, con asta clara y sin chaguar"></textarea></label>
      <div class="acciones"><button class="btn prim" type="submit">Enviar pedido</button><button class="btn" type="button" data-accion="cerrar">Cancelar</button></div>
    </form>`, true);
  }

  // ---------- Escrituras ----------
  async function evento(datos) {
    await S.db.collection("historial").add({ creado: ahora(), quien: S.yo || "", ...datos });
  }

  async function pedir(proyectoId, versionId, texto) {
    const ref = await S.db.collection("pedidos").add({ proyecto: proyectoId, version: versionId || "", texto, estado: "pendiente", creado: ahora(), quien: S.yo || "" });
    await evento({ proyecto: proyectoId, version: versionId || "", tipo: "pedido", texto, pedido: ref.id });
    avisar(AUTO ? "Pedido anotado: se dibuja solo en uno o dos minutos" : "Pedido anotado: Claude lo va a dibujar");
  }

  async function decidir(v, estado, texto) {
    const t = (texto || "").trim();
    if (!t) throw { mensaje: "Falta escribir por qué" };
    const mismo = v.estado === estado;
    await S.db.collection("versiones").doc(v.id).update({ estado, motivo: t, decidido: ahora(), decidioPor: S.yo || "" });
    await evento({ proyecto: v.proyecto, version: v.id, tipo: mismo ? "nota" : estado, texto: mismo ? `Nueva explicación: ${t}` : t });
    avisar(estado === "guardada" ? "Aceptado; ya está en el cerebro" : "Rechazado; ya está en el cerebro");
  }

  async function subirModelo(form) {
    const datos = new FormData(form);
    const archivo = datos.get("archivo");
    if (!archivo || !archivo.size) throw { mensaje: "Falta la foto" };
    const r = await S.assets.upload(archivo);
    const temporada = datos.get("temporada");
    const conservar = String(datos.get("conservar") || "").trim() || "Solo la forma y el tamaño";
    const notas = String(datos.get("notas") || "").trim();
    const nombre = String(datos.get("nombre")).trim();
    const ref = await S.db.collection("proyectos").add({ nombre, original: r.id, temporada, conservar, notas, creado: ahora(), creadoPor: S.yo || "", orden: Date.now() });
    await evento({ proyecto: ref.id, tipo: "subida", texto: `Se subió el modelo para ${String(temporada).toLowerCase()}.` });
    await pedir(ref.id, "", `Primeras versiones de ${String(temporada).toLowerCase()} al estilo Santesteban. Conservar: ${conservar.toLowerCase()}.${notas ? " " + notas : ""}`);
    S.sel = ref.id;
    S.filtro = "propuesta";
    S.tab = "taller";
  }

  async function pedirIdeas(p) {
    const zona = $("#zonaIdeas");
    if (zona) zona.innerHTML = `<div class="aviso" style="margin-top:24px">Claude está pensando ideas para «${esc(p.nombre)}»…</div>`;
    const c = cerebro();
    const lista = (arr) => arr.map((x) => "- " + x).join("\n") || "- (nada todavía)";
    const prompt = `Sos asistente de diseño de Santesteban, marca argentina de carteras y cinturones de autor.
Recursos propios de la marca: paños y franjas de chaguar tejido; asta (cierres, dijes, punteras); madera torneada o facetada; ónix; alpaca; coral; nácar; tiento (costura cruzada de cuero); trenzas de cuero; flecos y borlas; cueros suela, chocolate, negro y bordó; gamuza.

Cerebro de la diseñadora (lo que aprendimos de su gusto):
Le gusta:
${lista([...c.si.map((v) => `${v.motivo} (diseño «${v.nombre}»)`), ...c.siManual.map((g) => g.texto)])}
No le gusta:
${lista([...c.no.map((v) => `${v.motivo} (diseño «${v.nombre}»)`), ...c.noManual.map((g) => g.texto)])}
Reglas:
${lista(c.reglas.map((g) => g.texto))}

Modelo a transformar: «${p.nombre}». Temporada: ${p.temporada || "sin definir"}. Se conserva del original: ${p.conservar || "solo la forma y el tamaño"}. ${p.notas ? "Notas: " + p.notas : ""}
La imagen adjunta (si hay) es la foto del modelo original.

Proponé 3 versiones al estilo Santesteban para esa temporada. Los recursos de la marca tienen que ser parte de la construcción (un paño, una franja, un cierre, una costura), no un herraje pegado encima. La cartera no puede parecerse a la marca original más allá de la forma y el tamaño: nada de logos ni herrajes identificatorios.
Respondé solo con JSON, un array de 3 objetos con estas claves: "nombre" (corto, evocador, en español), "idea" (2 o 3 oraciones concretas: qué cambia y dónde), "materiales" (array de 2 a 5), "por_que" (una oración que lo conecte con el gusto de la diseñadora).`;
    const opciones = { modelTier: "default" };
    try {
      const lim = await S.sample.limits().catch(() => null);
      if (lim?.images && p.original) {
        const blob = await fetch(foto(p.original)).then((r) => (r.ok ? r.blob() : null)).catch(() => null);
        if (blob) opciones.images = [blob];
      }
      const res = await S.sample.json(prompt, opciones);
      const ideas = Array.isArray(res) ? res : Array.isArray(res?.ideas) ? res.ideas : [];
      if (!ideas.length) throw { message: "Claude no devolvió ideas" };
      for (const i of ideas.slice(0, 5)) {
        await S.db.collection("ideas").add({ proyecto: p.id, nombre: String(i.nombre || "Idea"), idea: String(i.idea || ""), materiales: Array.isArray(i.materiales) ? i.materiales.map(String).slice(0, 6) : [], por_que: String(i.por_que || ""), creado: ahora(), quien: S.yo || "" });
      }
      await evento({ proyecto: p.id, tipo: "ideas", texto: `Claude propuso: ${ideas.slice(0, 5).map((i) => i.nombre).join(", ")}.` });
      avisar("Listo: las ideas quedaron abajo");
    } catch (e) {
      const code = e?.code;
      const z = $("#zonaIdeas");
      if (z) z.innerHTML = `<div class="aviso" style="margin-top:24px">${code === "not_granted" ? "Para usar esta función hay que permitir que la página consulte a Claude." : code === "rate_limited" ? "Claude está ocupado; probá de nuevo en un rato." : "No salieron las ideas esta vez. Probá de nuevo más tarde."}</div>`;
      if (code === "not_granted") S.sample = null;
    }
  }

  async function descargar(v) {
    try {
      const blob = await fetch(foto(v.imagen)).then((r) => r.blob());
      const ext = (blob.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
      const nombre = `${(proyecto(v.proyecto)?.nombre || "taller")}-${v.nombre}`.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      await S.downloads.save({ filename: `${nombre}.${ext}`, data: blob });
    } catch (e) {
      if (e?.code === "unavailable") S.downloads = null;
      if (e?.code && e.code !== "declined" && e.code !== "cancelled") avisar("No se pudo descargar");
    }
  }

  // ---------- Eventos ----------
  document.addEventListener("click", async (ev) => {
    const tab = ev.target.closest(".menu [data-tab]");
    if (tab) { S.tab = tab.dataset.tab; render(); window.scrollTo?.(0, 0); return; }
    const el = ev.target.closest("[data-accion]");
    if (!el) { if (ev.target.id === "velo") cerrarVentana(); return; }
    const a = el.dataset.accion;
    const id = el.dataset.id;
    try {
      if (a === "elegir") { S.sel = id; S.tab = "taller"; S.filtro = "propuesta"; render(); }
      else if (a === "filtro") { S.filtro = el.dataset.f; render(); }
      else if (a === "hEstado") { S.hEstado = el.dataset.f; render(); }
      else if (a === "hVista") { S.hVista = el.dataset.f; render(); }
      else if (a === "abrir") abrirVersion(id);
      else if (a === "cerrar") cerrarVentana();
      else if (a === "decidir") abrirDecision(id, el.dataset.estado);
      else if (a === "cambio") abrirCambio(id);
      else if (a === "verOriginal") { const p = proyecto(S.sel); if (p?.original) abrirVentana(`<div class="detalle" style="grid-template-columns:1fr"><div class="imagenes"><img src="${foto(p.original)}" alt="Modelo original"></div></div>`); }
      else if (a === "verImg") {
        const det = el.closest(".detalle"); const v = version(det.dataset.version); const p = proyecto(v.proyecto);
        det.querySelectorAll(".conmutador button").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
        $("#imgDetalle").src = el.dataset.cual === "original" ? foto(p.original) : foto(v.imagen);
      }
      else if (a === "volverARevisar") {
        const v = version(id); if (!v) return;
        await S.db.collection("versiones").doc(v.id).update({ estado: "propuesta", motivo: "", decidido: "", decidioPor: "" });
        await evento({ proyecto: v.proyecto, version: v.id, tipo: "revisar", texto: "" });
        cerrarVentana(); avisar("Volvió a «para revisar» y salió del cerebro");
      }
      else if (a === "descargar") { const v = version(id); if (v) await descargar(v); }
      else if (a === "nuevoModelo") formularioModelo(null);
      else if (a === "editarModelo") formularioModelo(proyecto(S.sel));
      else if (a === "pedirVersiones") formularioPedido(proyecto(S.sel));
      else if (a === "ideas") { el.disabled = true; await pedirIdeas(proyecto(S.sel)); el.disabled = false; }
      else if (a === "ideaAPedido") {
        const i = S.ideas.find((x) => x.id === id); if (!i) return;
        await pedir(i.proyecto, "", `Dibujar la idea «${i.nombre}»: ${i.idea}${i.materiales?.length ? " Materiales: " + i.materiales.join(", ") + "." : ""}`);
      }
      else if (a === "borrarIdea") { await S.db.collection("ideas").doc(id).delete(); }
      else if (a === "borrarGusto") {
        const g = S.gusto.find((x) => x.id === id);
        await S.db.collection("gusto").doc(id).delete();
        if (g) await evento({ proyecto: "", tipo: "gusto", texto: `Se quitó del cerebro: ${g.texto}` });
      }
      else if (a === "borrarPedido") {
        const x = S.pedidos.find((p) => p.id === id);
        await S.db.collection("pedidos").doc(id).delete();
        if (x) await evento({ proyecto: x.proyecto, version: x.version || "", tipo: "nota", texto: `Se canceló el pedido: ${x.texto}` });
        cerrarVentana();
      }
      else if (a === "verPedido") abrirPedido(id);
      else if (a === "reintentarPedido") {
        await S.db.collection("pedidos").doc(id).update({ estado: "pendiente", nota: "" });
        cerrarVentana();
        avisar("Listo: el dibujante lo vuelve a intentar");
      }
      else if (a === "irAModelo") { S.sel = id; S.tab = "taller"; S.filtro = "propuesta"; render(); }
      else if (a === "salir") { el.disabled = true; await window.tallerWeb?.salir(); }
      else if (a === "avisoEquipo") {
        const m = window.tallerWeb.miembros().find((x) => x.email === id);
        if (m) mostrarAviso(m, false);
      }
      else if (a === "quitarAcceso" || a === "devolverAcceso") {
        const m = window.tallerWeb.miembros().find((x) => x.email === id);
        if (a === "quitarAcceso" && !confirm(`¿Quitarle el acceso al taller a ${m?.nombre || id}? Se le cierra la sesión y ya no puede entrar. Lo que hizo queda guardado.`)) return;
        el.disabled = true;
        await window.tallerWeb.cambiar(id, { activo: a === "devolverAcceso" });
        avisar(a === "quitarAcceso" ? "Acceso quitado" : "Acceso devuelto: ya puede volver a entrar con su mail");
        render();
      }
      else if (a === "copiarAviso") {
        const campo = $("#ventana .link-copiar");
        try { await navigator.clipboard.writeText(campo.value); avisar("Mensaje copiado"); }
        catch (_) { campo.select(); avisar("Seleccioná el mensaje y copialo"); }
      }
    } catch (e) {
      console.error(e);
      avisar(e?.mensaje || (e?.code === "not_granted" ? "No tenés permiso para cambiar esto" : "No se pudo guardar; probá de nuevo"));
    }
  });

  document.addEventListener("change", async (ev) => {
    if (ev.target.matches("select[data-rol]")) {
      const s = ev.target;
      s.disabled = true;
      try { await window.tallerWeb.cambiar(s.dataset.rol, { rol: s.value }); avisar("Cambio guardado"); }
      catch (e) { avisar(e?.mensaje || "No se pudo guardar; probá de nuevo"); }
      render();
      return;
    }
    if (ev.target.matches("[data-accion='hModelo']")) { S.hModelo = ev.target.value; render(); }
    if (ev.target.matches("form[data-form='decidir'] input[name='estado']")) {
      const no = ev.target.value === "descartada";
      $("#etqPorque").textContent = no ? "¿Por qué no?" : "¿Por qué sí?";
      ev.target.form.querySelector("textarea").placeholder = no ? "Ej.: el herraje queda pegado encima, no se integra" : "Ej.: el chaguar queda integrado a la cartera";
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && $("#velo").classList.contains("abierto")) cerrarVentana();
  });

  document.addEventListener("submit", async (ev) => {
    const f = ev.target.closest("form[data-form]");
    if (!f) return;
    ev.preventDefault();
    const boton = f.querySelector("button[type='submit']");
    if (boton) boton.disabled = true;
    try {
      const d = new FormData(f);
      if (f.dataset.form === "decidir") {
        const v = version(f.dataset.id);
        await decidir(v, d.get("estado"), d.get("texto"));
        cerrarVentana();
      } else if (f.dataset.form === "cambio") {
        const v = version(f.dataset.id);
        await pedir(v.proyecto, v.id, String(d.get("texto")).trim());
        cerrarVentana();
      } else if (f.dataset.form === "modelo") {
        if (f.dataset.id) {
          await S.db.collection("proyectos").doc(f.dataset.id).update({ nombre: String(d.get("nombre")).trim(), temporada: d.get("temporada"), conservar: String(d.get("conservar") || "").trim(), notas: String(d.get("notas") || "").trim() });
          await evento({ proyecto: f.dataset.id, tipo: "nota", texto: "Se actualizaron los datos del modelo." });
          avisar("Datos guardados");
        } else {
          avisar("Subiendo la foto…");
          await subirModelo(f);
        }
        cerrarVentana();
      } else if (f.dataset.form === "pedido") {
        await pedir(S.sel, "", String(d.get("texto")).trim());
        cerrarVentana();
      } else if (f.dataset.form === "pedidoLibre") {
        await pedir(String(d.get("proyecto")), "", String(d.get("texto")).trim());
        f.reset();
      } else if (f.dataset.form === "gusto") {
        const texto = String(d.get("texto")).trim();
        if (!texto) return;
        await S.db.collection("gusto").add({ tipo: d.get("tipo"), texto, proyecto: "", version: "", creado: ahora(), quien: S.yo || "" });
        await evento({ proyecto: "", tipo: "gusto", texto: `${TIPOS_MANUAL[d.get("tipo")]}: ${texto}` });
        f.reset();
        avisar("Anotado en el cerebro");
      } else if (f.dataset.form === "sumar") {
        const nombre = String(d.get("nombre") || "").trim();
        const email = String(d.get("email") || "").trim().toLowerCase();
        if (!nombre || !email) throw { mensaje: "Completá el nombre y el mail" };
        await window.tallerWeb.sumar({ nombre, email, rol: d.get("rol") });
        f.reset();
        render();
        mostrarAviso({ nombre, email }, true);
      }
    } catch (e) {
      console.error(e);
      avisar(e?.mensaje || (e?.code === "not_granted" ? "No tenés permiso para esto" : "No se pudo guardar; probá de nuevo"));
    } finally {
      if (boton) boton.disabled = false;
    }
  });

  // ---------- Nombres de las personas ----------
  let pidiendo = false;
  async function resolverNombres() {
    if (!S.user || pidiendo) return;
    const ids = [...new Set([...document.querySelectorAll("[data-uid]")].map((e) => e.dataset.uid))].filter((i) => i && i !== "claude" && i !== "chat");
    const faltan = ids.filter((i) => !(i in S.nombres));
    if (!faltan.length) return;
    pidiendo = true;
    try {
      const ps = await S.user.profiles(faltan);
      faltan.forEach((i) => { S.nombres[i] = ps?.[i]?.name || "Alguien del equipo"; });
      document.querySelectorAll("[data-uid]").forEach((e) => { const u = e.dataset.uid; if (S.nombres[u]) e.textContent = quien(u); });
    } catch (_) { /* sin nombres */ }
    pidiendo = false;
  }

  // ---------- Arranque ----------
  async function iniciar() {
    render();
    const reloj = setTimeout(() => { if (S.listos.size < 6) { S.cargaFallo = !S.db; render(); } }, 10000);
    const [db, assets, user, sample, downloads] = await Promise.all(["db", "assets", "user", "sample", "downloads"].map((n) => window.claude?.use?.(n).catch(() => null) ?? Promise.resolve(null)));
    S.db = db; S.assets = assets; S.user = user; S.sample = sample; S.downloads = downloads;
    if (!db) { clearTimeout(reloj); S.cargaFallo = true; render(); return; }
    if (user) {
      try { S.yo = (await user.id()) || ""; } catch (_) { S.yo = ""; }
      try { S.puede = await user.can("data.write"); } catch (_) { S.puede = null; }
    }
    for (const c of ["proyectos", "versiones", "historial", "gusto", "pedidos", "ideas"]) {
      db.collection(c).onSnapshot((snap) => {
        S[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        S.listos.add(c);
        if (S.listos.size >= 6) clearTimeout(reloj);
        render();
      }, (err) => {
        console.error(c, err);
        S.listos.add(c);
        $("#avisoGeneral").textContent = "Hubo un problema leyendo parte del taller. Recargá la página en un rato.";
        $("#avisoGeneral").classList.remove("oculto");
        render();
      });
    }
    window.tallerWeb?.alCambiar(render);
  }
  // En la versión web, el taller arranca recién cuando la persona entró con su cuenta.
  (window.tallerListo || Promise.resolve()).then(iniciar);
})();
</script>
