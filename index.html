<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='42' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<title>Taller Santesteban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
/* Estética Santesteban: blanco y negro, Tenor Sans, mayúsculas espaciadas, fotos sobre gris claro, sin redondeos ni sombras. */
:root {
  --bg: #FFFFFF; --tx: #000000; --mu: #707070; --li: #E5E5E5; --foto: #F4F4F4; --suave: #F7F7F7;
  --inv-bg: #000000; --inv-tx: #FFFFFF; --velo: rgba(0, 0, 0, .45); --logo: none;
  --fuente: "Tenor Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0B; --tx: #F2F2F2; --mu: #9A9A9A; --li: #2A2A2A; --foto: #171717; --suave: #121212;
    --inv-bg: #F2F2F2; --inv-tx: #0B0B0B; --velo: rgba(0, 0, 0, .7); --logo: invert(1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0B; --tx: #F2F2F2; --mu: #9A9A9A; --li: #2A2A2A; --foto: #171717; --suave: #121212;
  --inv-bg: #F2F2F2; --inv-tx: #0B0B0B; --velo: rgba(0, 0, 0, .7); --logo: invert(1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.6 var(--fuente); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
a { color: inherit; }

/* Armazón */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg); border-right: 1px solid var(--li);
  padding: 34px 22px 28px max(22px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 36px; }
.marca { display: flex; flex-direction: column; gap: 10px; }
.marca img { height: 15px; width: auto; align-self: flex-start; filter: var(--logo); }
.marca span { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--mu); }
.menu { display: flex; flex-direction: column; gap: 4px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 0; cursor: pointer;
  color: var(--mu); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; text-align: left; }
.menu button:hover { color: var(--tx); }
.menu button[aria-current="page"] { color: var(--tx); }
.menu button[aria-current="page"]::before { content: ""; width: 14px; height: 1px; background: var(--tx); margin-right: -2px; }
.menu svg { display: none; }
.menu .contador { margin-left: auto; }
.contador { display: inline-block; min-width: 18px; padding: 0 5px; background: var(--inv-bg); color: var(--inv-tx); font-size: 10px; line-height: 18px; text-align: center; letter-spacing: 0; }
.contador.suave { background: none; color: var(--mu); }
.grupo-modelos { display: flex; flex-direction: column; gap: 12px; }
.grupo-modelos .titulo { display: flex; align-items: center; justify-content: space-between; }
.etiqueta { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--mu); }
.mas { border: 0; background: none; padding: 0; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; color: var(--tx);
  border-bottom: 1px solid var(--tx); }
.modelos { display: flex; flex-direction: column; gap: 6px; }
.modelo { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; background: none; border: 0;
  padding: 4px 0; cursor: pointer; width: 100%; color: var(--mu); }
.modelo:hover, .modelo[aria-current="true"] { color: var(--tx); }
.modelo img, .modelo .sinfoto { width: 44px; height: 44px; object-fit: contain; background: var(--foto); }
.modelo[aria-current="true"] img { outline: 1px solid var(--tx); outline-offset: 2px; }
.modelo b { display: block; font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tx); }
.modelo small { font-size: 11px; color: var(--mu); }
.contenido { padding: 40px max(20px, env(safe-area-inset-right)) 80px 48px; min-width: 0; }
.contenido > div { max-width: 1180px; }
.cabeza { margin: 0 0 28px; }
.cabeza h1 { font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
.cabeza p { margin: 0; color: var(--mu); max-width: 680px; }
.aviso { border: 1px solid var(--li); padding: 14px 16px; color: var(--mu); margin: 0 0 22px; background: var(--suave); }
.aviso strong { color: var(--tx); font-weight: 400; }

/* Botones, etiquetas */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--tx); background: transparent; padding: 10px 18px; cursor: pointer;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border-radius: 0; }
.btn:hover { background: var(--tx); color: var(--bg); }
.btn.prim { background: var(--tx); color: var(--bg); }
.btn.prim:hover { opacity: .85; }
.btn.ok, .btn.no { border-color: var(--tx); }
.btn.no { color: var(--mu); border-color: var(--li); }
.btn.no:hover { color: var(--bg); background: var(--mu); border-color: var(--mu); }
.btn.chico { padding: 7px 12px; font-size: 10px; }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 1px solid var(--tx); outline-offset: 3px; }
.chip { display: inline-block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; padding: 3px 7px; color: var(--mu); border: 1px solid var(--li); white-space: nowrap; line-height: 1.3; }
.chip.invierno, .chip.verano { color: var(--tx); }
.chip.guardada { background: var(--tx); color: var(--bg); border-color: var(--tx); }
.chip.descartada { color: var(--mu); background: var(--suave); border-color: var(--suave); }
.chip.propuesta, .chip.pendiente { color: var(--tx); border-color: var(--tx); }
.fila { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.vacio { border-top: 1px solid var(--li); border-bottom: 1px solid var(--li); padding: 34px; text-align: center; color: var(--mu); }
.filtros { display: flex; gap: 22px; flex-wrap: wrap; margin: 40px 0 22px; align-items: center; border-bottom: 1px solid var(--li); }
.filtros button { border: 0; background: none; padding: 0 0 10px; margin-bottom: -1px; cursor: pointer; color: var(--mu); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid transparent; }
.filtros button[aria-pressed="true"] { color: var(--tx); border-bottom-color: var(--tx); }
.filtros select { width: auto; margin-bottom: 8px; }
select, input[type="text"], textarea { background: var(--bg); border: 1px solid var(--li); border-radius: 0; padding: 10px 12px; width: 100%; }
select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--tx); outline: none; }
textarea { min-height: 96px; resize: vertical; }
label { display: flex; flex-direction: column; gap: 8px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mu); }
label textarea, label input, label select { font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--tx); }

/* Taller */
.ficha { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; align-items: start; }
.ficha .original { background: var(--foto); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; cursor: zoom-in; border: 0; padding: 0; }
.ficha .original img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.ficha h1 { font-weight: 400; font-size: 34px; line-height: 1.1; letter-spacing: .06em; text-transform: uppercase; margin: 12px 0 14px; }
.ficha dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; margin: 0 0 22px; }
.ficha dt { color: var(--mu); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; padding-top: 3px; }
.ficha dd { margin: 0; }
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 36px 22px; }
.tarjeta { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 12px; color: var(--tx); }
.tarjeta .foto { aspect-ratio: 1; background: var(--foto); display: grid; place-items: center; overflow: hidden; }
.tarjeta .foto img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; transition: transform .4s ease; }
.tarjeta:hover .foto img { transform: scale(1.03); }
.tarjeta .texto { display: flex; flex-direction: column; gap: 6px; }
.tarjeta b { font-weight: 400; font-size: 14px; }
.tarjeta p { margin: 0; color: var(--mu); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tarjeta.descartada .foto img { opacity: .45; filter: grayscale(1); }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 28px; margin-top: 6px; }
.idea { border-top: 1px solid var(--li); padding: 16px 0; display: flex; flex-direction: column; gap: 8px; }
.idea b { font-weight: 400; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.idea p { margin: 0; }
.idea small { color: var(--mu); font-size: 12px; }
.seccion { margin-top: 44px; }
.seccion > .etiqueta { display: block; margin-bottom: 14px; }

/* Historial */
.resumen { display: flex; gap: 0; flex-wrap: wrap; margin: 0 0 4px; border-top: 1px solid var(--li); border-bottom: 1px solid var(--li); }
.dato { padding: 16px 28px 16px 0; margin-right: 28px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--li); min-width: 130px; }
.dato:last-child { border-right: 0; }
.dato b { font-weight: 400; font-size: 30px; line-height: 1; }
.dato span { color: var(--mu); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.grupo { margin-top: 40px; }
.grupo h2 { display: flex; align-items: center; gap: 14px; font-weight: 400; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 6px; }
.grupo h2 img { width: 40px; height: 40px; object-fit: contain; background: var(--foto); mix-blend-mode: multiply; }
.grupo h2 small { font-size: 10px; letter-spacing: .16em; color: var(--mu); }
.registros { display: flex; flex-direction: column; border-top: 1px solid var(--tx); }
.registro { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 22px; align-items: start; border-bottom: 1px solid var(--li); padding: 18px 0; }
.registro > button.foto { border: 0; padding: 0; background: var(--foto); width: 96px; height: 96px; cursor: zoom-in; overflow: hidden; }
.registro > button.foto img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.registro.descartada > button.foto img { opacity: .5; filter: grayscale(1); }
.registro b { font-weight: 400; font-size: 15px; margin-right: 6px; }
.porque { margin: 10px 0 6px; }
.porque em { font-style: normal; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mu); margin-right: 6px; }
.registro.guardada .porque em { color: var(--tx); }
.registro small, .quien { color: var(--mu); font-size: 11.5px; }
.linea { display: flex; flex-direction: column; border-top: 1px solid var(--tx); }
.evento { display: grid; grid-template-columns: 80px minmax(0, 1fr) 56px; gap: 18px; padding: 16px 0; border-bottom: 1px solid var(--li); align-items: start; }
.evento time { color: var(--mu); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding-top: 3px; }
.evento .que { display: flex; flex-direction: column; gap: 6px; }
.evento img { width: 56px; height: 56px; object-fit: contain; background: var(--foto); cursor: pointer; mix-blend-mode: multiply; }
.vistas { display: inline-flex; gap: 22px; }
.vistas button { border: 0; background: none; padding: 0 0 10px; margin-bottom: -1px; cursor: pointer; color: var(--mu); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid transparent; }
.vistas button[aria-pressed="true"] { color: var(--tx); border-bottom-color: var(--tx); }

/* Cerebro */
.cerebro { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: 8px; border-top: 1px solid var(--tx); }
.columna { padding: 22px 26px 10px 0; border-right: 1px solid var(--li); }
.columna + .columna { padding-left: 26px; }
.columna:last-child { border-right: 0; padding-right: 0; }
.columna h3 { font-weight: 400; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
.columna h3 small { font-size: 11px; color: var(--mu); letter-spacing: 0; }
.columna > p { margin: 0; color: var(--mu); font-size: 12px; }
.columna ul { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; }
.columna li { border-top: 1px solid var(--li); padding: 14px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.prueba { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; color: var(--mu); font-size: 11px; }
.prueba img { width: 32px; height: 32px; object-fit: contain; background: var(--foto); cursor: pointer; mix-blend-mode: multiply; }
.prueba a { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.quitar { border: 0; background: none; color: var(--mu); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
.quitar:hover { color: var(--tx); }
.agregar { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 10px; margin-top: 30px; }

/* Pedidos */
.pasos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 0 0 34px; border-top: 1px solid var(--tx); }
.paso { padding: 22px 26px 22px 0; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--li); }
.paso + .paso { padding-left: 26px; }
.paso:last-child { border-right: 0; }
.paso .num { font-size: 30px; line-height: 1; color: var(--tx); }
.paso .num::before { content: "0"; }
.paso b { font-weight: 400; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.paso p { margin: 0; color: var(--mu); }
.nuevo-pedido { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.nuevo-pedido textarea { min-height: 44px; }
.pedido { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 20px; border-bottom: 1px solid var(--li); padding: 16px 0; align-items: center; }
.pedido img, .pedido .sinfoto { width: 72px; height: 72px; object-fit: contain; background: var(--foto); mix-blend-mode: multiply; }
.pedido p { margin: 6px 0 4px; }
.lista { display: flex; flex-direction: column; border-top: 1px solid var(--tx); }

/* Ventanas */
.velo { position: fixed; inset: 0; background: var(--velo); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.velo.abierto { display: flex; }
.ventana { background: var(--bg); max-width: 1080px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--li); }
.ventana.chica { max-width: 600px; }
.detalle { display: grid; grid-template-columns: 1.3fr 1fr; }
.detalle .imagenes { background: var(--foto); position: relative; min-height: 340px; display: grid; place-items: center; }
.detalle .imagenes img { width: 100%; height: 100%; max-height: 80vh; object-fit: contain; mix-blend-mode: multiply; }
.conmutador { position: absolute; top: 16px; left: 16px; display: flex; gap: 16px; }
.conmutador button { border: 0; background: none; padding: 0 0 4px; cursor: pointer; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mu); border-bottom: 1px solid transparent; }
.conmutador button[aria-pressed="true"] { color: var(--tx); border-bottom-color: var(--tx); }
.detalle .info { padding: 34px 30px; display: flex; flex-direction: column; gap: 16px; }
.detalle h2 { font-weight: 400; font-size: 24px; line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.detalle .desc { margin: 0; }
.estado { font-size: 13px; color: var(--mu); margin: 0; }
.estado b { font-weight: 400; color: var(--tx); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; margin-right: 4px; }
.linaje { font-size: 13px; color: var(--mu); margin: 0; }
.linaje a { color: var(--tx); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.cerrar { position: sticky; top: 0; float: right; border: 0; background: var(--bg); width: 40px; height: 40px; cursor: pointer; font-size: 22px; font-weight: 300; z-index: 2; }
.formulario { padding: 34px 30px; display: flex; flex-direction: column; gap: 18px; }
.formulario h2 { font-weight: 400; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.formulario p { margin: 0; color: var(--mu); }
.quien-decide { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; align-items: center; }
.quien-decide img { width: 72px; height: 72px; object-fit: contain; background: var(--foto); mix-blend-mode: multiply; }
.eleccion { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opcion { flex-direction: row; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--li); padding: 14px; cursor: pointer; color: var(--tx); font-size: 11px; letter-spacing: .16em; }
.opcion input { accent-color: var(--tx); margin: 0; }
.opcion:has(input:checked) { border-color: var(--tx); background: var(--tx); color: var(--bg); }
.mensaje { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 12px 20px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.mensaje.visible { opacity: 1; }
.oculto { display: none !important; }

@media (max-width: 1100px) { .cerebro { grid-template-columns: 1fr 1fr; } .columna.reglas { grid-column: 1 / -1; border-top: 1px solid var(--li); padding-left: 0; } }
@media (max-width: 900px) {
  .app { display: block; }
  .lateral { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--li); gap: 18px;
    padding: 20px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
  .marca { flex-direction: row; align-items: center; justify-content: space-between; }
  .menu { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 20px; }
  .menu::-webkit-scrollbar { display: none; }
  .menu button { width: auto; white-space: nowrap; }
  .menu button[aria-current="page"]::before { display: none; }
  .menu button[aria-current="page"] { border-bottom: 1px solid var(--tx); }
  .modelos { flex-direction: row; overflow-x: auto; gap: 16px; padding-bottom: 4px; }
  .modelo { min-width: 170px; }
  body:not([data-seccion="taller"]) .grupo-modelos { display: none; }
  .contenido { padding: 26px max(16px, env(safe-area-inset-right)) 60px max(16px, env(safe-area-inset-left)); }
  .detalle { grid-template-columns: 1fr; }
  .pasos { grid-template-columns: 1fr; }
  .paso, .paso + .paso { padding: 18px 0; border-right: 0; border-bottom: 1px solid var(--li); }
  .nuevo-pedido { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .cabeza h1 { font-size: 24px; }
  .ficha { grid-template-columns: 1fr; gap: 18px; }
  .ficha .original { max-width: 240px; }
  .ficha h1 { font-size: 26px; }
  .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 12px; }
  .cerebro { grid-template-columns: 1fr; }
  .columna, .columna + .columna { padding: 18px 0; border-right: 0; border-bottom: 1px solid var(--li); }
  .dato { min-width: 0; flex: 1 1 0; padding: 12px 10px 12px 0; margin-right: 10px; }
  .dato b { font-size: 24px; }
  .registro { grid-template-columns: 72px minmax(0, 1fr); gap: 14px; }
  .registro > button.foto { width: 72px; height: 72px; }
  .registro > .acciones { grid-column: 1 / -1; }
  .evento { grid-template-columns: 52px minmax(0, 1fr) 48px; gap: 12px; }
  .evento img { width: 48px; height: 48px; }
  .agregar { grid-template-columns: 1fr; }
  .pedido { grid-template-columns: 56px minmax(0, 1fr); }
  .pedido img, .pedido .sinfoto { width: 56px; height: 56px; }
  .pedido > .acciones { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .tarjeta .foto img { transition: none; } .tarjeta:hover .foto img { transform: none; } }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) img { mix-blend-mode: normal !important; } }
:root[data-theme="dark"] img { mix-blend-mode: normal !important; }

/* Pedidos en producción dentro de la grilla */
.tarjeta.en-produccion .foto { position: relative; background: var(--li); }
.tarjeta.en-produccion .foto img { opacity: .14; filter: grayscale(1); mix-blend-mode: normal; }
.tarjeta.en-produccion:hover .foto img { transform: none; }
.sello { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
  font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--tx); text-align: center; }
.sello small { font-size: 9.5px; letter-spacing: .14em; color: var(--mu); }
.sello::after { content: ""; width: 44px; height: 1px; background: var(--tx); animation: produccion 1.8s ease-in-out infinite; }
@keyframes produccion { 0%, 100% { transform: scaleX(.15); opacity: .35; } 50% { transform: scaleX(1); opacity: 1; } }
.tarjeta.en-produccion b { color: var(--mu); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .sello::after { animation: none; } }

/* Versión web: entrada con mail y contraseña, cuenta y equipo */
input[type="email"], input[type="password"] { background: var(--bg); border: 1px solid var(--li); border-radius: 0; padding: 10px 12px; width: 100%; }
input[type="email"]:focus, input[type="password"]:focus { border-color: var(--tx); outline: none; }
body.con-acceso .app { visibility: hidden; }
.acceso { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 32px 16px; overflow-y: auto; }
.acceso-caja { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 44px; margin: auto 0; }
.acceso-caja .marca { flex-direction: column; align-items: flex-start; justify-content: flex-start; }
.acceso-caja .marca img { height: 18px; }
.acceso-form { display: flex; flex-direction: column; gap: 18px; }
.acceso-form h1 { font-weight: 400; font-size: 24px; line-height: 1.2; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.acceso-form p { margin: 0; color: var(--mu); }
.acceso-form .btn { justify-content: center; padding: 13px 18px; }
.acceso-form .acceso-error { color: var(--tx); border-left: 1px solid var(--tx); padding-left: 12px; }
.acceso-error:empty { display: none; }
.acceso-ayuda { font-size: 12.5px; }
.acceso-form b { font-weight: 400; color: var(--tx); overflow-wrap: anywhere; }
.acceso-form input.codigo { font-size: 26px; letter-spacing: .4em; text-align: center; padding: 12px; }
.acceso-ayuda a.apagado { color: var(--mu); text-decoration: none; cursor: default; }
.cuenta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid var(--li); }
.cuenta span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.equipo { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--li); }
.equipo li { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--li); }
.equipo li.inactivo b, .equipo li.inactivo .rol { color: var(--mu); }
.equipo b { display: block; font-weight: 400; font-size: 15px; }
.equipo small { display: block; color: var(--mu); font-size: 12px; overflow-wrap: anywhere; }
.equipo .rol { display: flex; flex-direction: column; gap: 4px; }
.equipo select { width: auto; max-width: 100%; padding: 7px 10px; font-size: 12.5px; }
.equipo .fila { justify-content: flex-end; }
.sumar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: end; max-width: 900px; }
.sumar .btn { justify-content: center; grid-column: 1 / -1; justify-self: start; }
.link-copiar { font-size: 12.5px; }
@media (max-width: 900px) {
  .cuenta { margin-top: 0; padding-top: 12px; }
  .equipo li { grid-template-columns: 1fr; gap: 10px; }
  .equipo .fila { justify-content: flex-start; }
  .sumar { grid-template-columns: 1fr; }
}
</style>
</head>

      <button data-tab="equipo" class="oculto" id="menuEquipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M17.5 14a5 5 0 0 1 3 5"/></svg>Equipo</button>

      <div class="titulo"><span class="etiqueta">Modelos</span><button class="mas oculto" id="botonSubir" data-accion="nuevoModelo">Subir</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script>window.TALLER_CONFIG = {"url": "https://uciczinndycglgiqvkhh.supabase.co", "clave": "sb_publishable_Iv3ZOIoIl8nRoamG6Aq5Nw_p7nYcK6-", "largoCodigo": 6, "repoPagina": "joaquinlombardi-wq/taller-santesteban"};</script>
<script>
// Versión web del taller: conecta la página con Supabase (datos, fotos y personas) y muestra la pantalla para entrar.
// Imita la forma de trabajar del taller en Claude (window.claude.use), así la página es la misma en los dos lugares.
(() => {
  const C = window.TALLER_CONFIG || {};
  // La sesión se guarda en tres lugares, para no tener que volver a entrar: la memoria del navegador (localStorage),
  // una cookie del sitio y la memoria de la página. Algunos Chrome borran la primera al recargar; con la cookie
  // la sesión sigue. Si el navegador bloquea las dos, la pantalla de entrada lo avisa.
  const CLAVE_SESION = "sb-" + new URL(C.url || "https://x.invalid").hostname.split(".")[0] + "-auth-token";
  const RUTA = location.pathname.replace(/[^/]*$/, "") || "/";
  const memoriaSesion = new Map();
  const cookie = {
    leer(n) {
      const todas = Object.fromEntries(document.cookie.split("; ").filter(Boolean).map((c) => { const i = c.indexOf("="); return [c.slice(0, i), c.slice(i + 1)]; }));
      const partes = Number(todas[n + ".n"] || 0);
      if (!partes) return null;
      let v = "";
      for (let i = 0; i < partes; i++) { if (todas[`${n}.${i}`] === undefined) return null; v += todas[`${n}.${i}`]; }
      try { return decodeURIComponent(v); } catch (_) { return null; }
    },
    poner(n, valor, dias = 60) {
      const cod = encodeURIComponent(valor);
      const trozos = cod.match(/.{1,3000}/g) || [""];
      const fin = `; path=${RUTA}; max-age=${dias * 86400}; SameSite=Lax; Secure`;
      const antes = Number(this.partes(n));
      trozos.forEach((t, i) => { document.cookie = `${n}.${i}=${t}${fin}`; });
      for (let i = trozos.length; i < antes; i++) document.cookie = `${n}.${i}=; path=${RUTA}; max-age=0`;
      document.cookie = `${n}.n=${trozos.length}${fin}`;
    },
    partes(n) { const m = document.cookie.match(new RegExp(`(?:^|; )${n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\.n=(\\d+)`)); return m ? m[1] : 0; },
    borrar(n) {
      const antes = Number(this.partes(n));
      for (let i = 0; i < antes; i++) document.cookie = `${n}.${i}=; path=${RUTA}; max-age=0`;
      document.cookie = `${n}.n=; path=${RUTA}; max-age=0`;
    },
  };
  const almacen = {
    getItem(k) {
      try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (_) { /* sin memoria del navegador */ }
      if (k === CLAVE_SESION) { try { const v = cookie.leer(k); if (v !== null) return v; } catch (_) { /* sin cookies */ } }
      return memoriaSesion.has(k) ? memoriaSesion.get(k) : null;
    },
    setItem(k, v) {
      memoriaSesion.set(k, v);
      try { localStorage.setItem(k, v); } catch (_) { /* queda en la cookie o en memoria */ }
      if (k === CLAVE_SESION) { try { cookie.poner(k, v); } catch (_) { /* queda en memoria */ } }
    },
    removeItem(k) {
      memoriaSesion.delete(k);
      try { localStorage.removeItem(k); } catch (_) { /* nada */ }
      if (k === CLAVE_SESION) { try { cookie.borrar(k); } catch (_) { /* nada */ } }
    },
  };
  // ¿Este navegador deja guardar la sesión? (se informa en la pantalla de entrada y al servidor, sin datos personales)
  function revisarAlmacen() {
    const d = { ls: "ok", cookies: "ok", sesionLs: false, sesionCookie: false, visitaAnterior: null };
    try { localStorage.setItem("taller-prueba", "1"); if (localStorage.getItem("taller-prueba") !== "1") d.ls = "no-guarda"; localStorage.removeItem("taller-prueba"); }
    catch (e) { d.ls = "bloqueado:" + (e?.name || "error"); }
    try { document.cookie = `taller-prueba=1; path=${RUTA}; max-age=60; SameSite=Lax; Secure`; if (!/(?:^|; )taller-prueba=1/.test(document.cookie)) d.cookies = "no-guarda"; }
    catch (e) { d.cookies = "bloqueado:" + (e?.name || "error"); }
    try { d.sesionLs = !!localStorage.getItem(CLAVE_SESION); } catch (_) { /* nada */ }
    try { d.sesionCookie = cookie.leer(CLAVE_SESION) !== null; } catch (_) { /* nada */ }
    try { d.visitaAnterior = localStorage.getItem("taller-visita"); localStorage.setItem("taller-visita", new Date().toISOString()); } catch (_) { /* nada */ }
    return d;
  }
  const ALMACEN = revisarAlmacen();
  const sb = window.supabase.createClient(C.url, C.clave, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: almacen },
  });
  const COLECCIONES = ["proyectos", "versiones", "historial", "gusto", "pedidos", "ideas"];
  const W = { sesion: null, yo: null, miembros: [], datos: new Map(), oyentes: new Map(), alCambiar: new Set(), suscripto: false };
  COLECCIONES.forEach((c) => W.datos.set(c, new Map()));
  let abrirTaller;
  window.tallerListo = new Promise((r) => (abrirTaller = r));

  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const azar = (n) => crypto.getRandomValues(new Uint8Array(n));
  const nuevoId = () => [...azar(20)].map((x) => "abcdefghijklmnopqrstuvwxyz0123456789"[x % 36]).join("");
  const nuevoIdFoto = () => [...azar(16)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const copia = (d) => JSON.parse(JSON.stringify(d ?? {}));
  function fallo(e, mensaje) {
    const sinPermiso = e?.code === "42501" || /row-level security|permission denied/i.test(e?.message || "");
    return Object.assign(new Error(e?.message || "Error"), { code: sinPermiso ? "not_granted" : e?.code || "error", mensaje });
  }

  // ---------- Fotos (privadas: se piden links firmados que duran 7 días) ----------
  const LS_FOTOS = "taller-fotos-v1";
  const DURACION = 7 * 24 * 3600;
  const fotos = new Map();
  const fallidas = new Map();
  try {
    const g = JSON.parse(localStorage.getItem(LS_FOTOS) || "{}");
    for (const [id, f] of Object.entries(g)) if (f && f.e > Date.now()) fotos.set(id, f);
  } catch (_) { /* sin memoria del navegador */ }
  let tGuardar;
  const guardarFotos = () => {
    clearTimeout(tGuardar);
    tGuardar = setTimeout(() => { try { localStorage.setItem(LS_FOTOS, JSON.stringify(Object.fromEntries(fotos))); } catch (_) { /* nada */ } }, 400);
  };
  const vigente = (id) => { const f = fotos.get(id); return f && f.e > Date.now() + 6 * 3600e3; };
  async function firmar(ids) {
    let nuevas = 0;
    for (let i = 0; i < ids.length; i += 100) {
      const parte = ids.slice(i, i + 100);
      const { data, error } = await sb.storage.from("imagenes").createSignedUrls(parte, DURACION);
      if (error) throw error;
      const vence = Date.now() + DURACION * 1000;
      for (const x of data || []) {
        if (x.signedUrl && !x.error) { fotos.set(x.path, { u: x.signedUrl, e: vence }); fallidas.delete(x.path); nuevas++; }
        else if (x.path) fallidas.set(x.path, Date.now());
      }
    }
    if (nuevas) guardarFotos();
    return nuevas;
  }
  async function asegurarFotos(docs) {
    const faltan = new Set();
    for (const d of docs) for (const k of ["original", "imagen"]) {
      const id = d?.[k];
      if (typeof id === "string" && id && !vigente(id) && !(Date.now() - (fallidas.get(id) || 0) < 300e3)) faltan.add(id);
    }
    if (faltan.size) await firmar([...faltan]);
  }
  const porFirmar = new Set();
  let tFirma;
  window.tallerFoto = (id) => {
    const f = fotos.get(id);
    if (!vigente(id) && !(Date.now() - (fallidas.get(id) || 0) < 300e3)) {
      porFirmar.add(id);
      clearTimeout(tFirma);
      tFirma = setTimeout(async () => {
        const ids = [...porFirmar];
        porFirmar.clear();
        try { if (await firmar(ids)) COLECCIONES.forEach(emitir); } catch (e) { console.warn(e); }
      }, 40);
    }
    return f && f.e > Date.now() ? f.u : "";
  };

  // ---------- Documentos (como la base del taller en Claude) ----------
  function instantanea(c) {
    const docs = [...(W.datos.get(c) || new Map())].map(([id, d]) => ({ id, data: () => copia(d) }));
    return { docs, size: docs.length, empty: !docs.length, forEach: (f) => docs.forEach(f) };
  }
  const porEmitir = new Set();
  let tEmitir;
  function emitir(c) {
    porEmitir.add(c);
    clearTimeout(tEmitir);
    tEmitir = setTimeout(async () => {
      const cs = [...porEmitir];
      porEmitir.clear();
      for (const col of cs) {
        try { await asegurarFotos([...(W.datos.get(col)?.values() || [])]); } catch (e) { console.warn(e); }
        for (const o of W.oyentes.get(col) || []) { try { o.cb(instantanea(col)); } catch (e) { console.error(e); } }
      }
    }, 20);
  }
  const mapa = (c) => { if (!W.datos.has(c)) W.datos.set(c, new Map()); return W.datos.get(c); };

  async function cargarTodo() {
    const filas = [];
    for (let desde = 0; ; desde += 1000) {
      const { data, error } = await sb.from("documentos").select("coleccion,id,datos").order("coleccion").order("id").range(desde, desde + 999);
      if (error) throw error;
      filas.push(...data);
      if (data.length < 1000) break;
    }
    for (const m of W.datos.values()) m.clear();
    for (const f of filas) mapa(f.coleccion).set(f.id, f.datos);
    try { await asegurarFotos(filas.map((f) => f.datos)); } catch (e) { console.warn(e); }
    W.cargado = Date.now();
  }

  async function cargarMiembros() {
    const { data, error } = await sb.from("miembros").select("email,id,nombre,rol,activo,alias,ultimo_ingreso");
    if (error) throw error;
    W.miembros = data || [];
    const yo = W.miembros.find((m) => m.id === W.sesion?.user?.id && m.activo) || null;
    if (W.yo && !yo) { await salir(); return; } // le quitaron el acceso mientras estaba adentro
    W.yo = yo;
    W.alCambiar.forEach((f) => { try { f(); } catch (_) { /* nada */ } });
  }

  function suscribir() {
    if (W.suscripto) return;
    W.suscripto = true;
    let primera = true;
    sb.channel("taller")
      .on("postgres_changes", { event: "*", schema: "public", table: "documentos" }, (p) => {
        const f = p.eventType === "DELETE" ? p.old : p.new;
        if (!f?.coleccion || !f?.id) return;
        if (p.eventType === "DELETE") mapa(f.coleccion).delete(f.id);
        else mapa(f.coleccion).set(f.id, p.new.datos);
        emitir(f.coleccion);
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "miembros" }, () => { cargarMiembros().catch(console.warn); })
      .subscribe((estado) => {
        if (estado !== "SUBSCRIBED") return;
        if (primera) { primera = false; return; }
        refrescar(); // volvió la conexión: traigo todo por si me perdí algún cambio
      });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && Date.now() - (W.cargado || 0) > 5 * 60e3) refrescar();
    });
  }
  function refrescar() {
    Promise.all([cargarTodo(), cargarMiembros()]).then(() => COLECCIONES.forEach(emitir)).catch(console.warn);
  }

  const db = {
    collection(c) {
      return {
        onSnapshot(cb, err) {
          if (!W.oyentes.has(c)) W.oyentes.set(c, new Set());
          const o = { cb, err };
          W.oyentes.get(c).add(o);
          setTimeout(() => { try { cb(instantanea(c)); } catch (e) { console.error(e); } }, 0);
          return () => W.oyentes.get(c)?.delete(o);
        },
        async add(datos) {
          const id = nuevoId();
          mapa(c).set(id, copia(datos));
          emitir(c);
          const { error } = await sb.from("documentos").insert({ coleccion: c, id, datos });
          if (error) { mapa(c).delete(id); emitir(c); throw fallo(error); }
          return { id };
        },
        doc(id) {
          return {
            id,
            async get() {
              const { data, error } = await sb.from("documentos").select("datos").match({ coleccion: c, id }).maybeSingle();
              if (error) throw fallo(error);
              return { id, exists: !!data, data: () => (data ? copia(data.datos) : undefined) };
            },
            async set(datos) {
              const antes = mapa(c).get(id);
              mapa(c).set(id, copia(datos));
              emitir(c);
              const { error } = await sb.from("documentos").upsert({ coleccion: c, id, datos });
              if (error) { if (antes === undefined) mapa(c).delete(id); else mapa(c).set(id, antes); emitir(c); throw fallo(error); }
            },
            async update(parche) {
              const antes = mapa(c).get(id);
              if (antes) { mapa(c).set(id, { ...antes, ...copia(parche) }); emitir(c); }
              const { error } = await sb.rpc("actualizar_documento", { p_coleccion: c, p_id: id, p_parche: parche });
              if (error) { if (antes) { mapa(c).set(id, antes); emitir(c); } throw fallo(error); }
            },
            async delete() {
              const antes = mapa(c).get(id);
              mapa(c).delete(id);
              emitir(c);
              const { error } = await sb.from("documentos").delete().match({ coleccion: c, id });
              if (error) { if (antes) { mapa(c).set(id, antes); emitir(c); } throw fallo(error); }
            },
          };
        },
      };
    },
  };

  // Achica las fotos muy pesadas antes de subirlas (las del celular pueden pesar 5 MB o más)
  async function achicar(archivo) {
    try {
      if (!/^image\/(jpeg|png|webp)$/.test(archivo.type) || archivo.size < 1.5e6) return archivo;
      const bm = await createImageBitmap(archivo);
      const k = Math.min(1, 2400 / Math.max(bm.width, bm.height));
      if (k === 1 && archivo.size < 4e6) return archivo;
      const cv = document.createElement("canvas");
      cv.width = Math.round(bm.width * k);
      cv.height = Math.round(bm.height * k);
      cv.getContext("2d").drawImage(bm, 0, 0, cv.width, cv.height);
      const b = await new Promise((r) => cv.toBlob(r, archivo.type === "image/png" ? "image/png" : "image/jpeg", 0.9));
      return b && b.size < archivo.size ? b : archivo;
    } catch (_) {
      return archivo;
    }
  }

  const assets = {
    async upload(archivo) {
      const listo = await achicar(archivo);
      const tipo = listo.type || archivo.type || "";
      if (!/^image\/(jpeg|png|webp|gif|avif)$/.test(tipo)) throw { mensaje: "La foto tiene que ser JPG, PNG o WEBP" };
      const id = nuevoIdFoto();
      const { error } = await sb.storage.from("imagenes").upload(id, listo, { contentType: tipo, cacheControl: "31536000", upsert: false });
      if (error) throw fallo(error, /size|large/i.test(error.message || "") ? "La foto es muy pesada (máximo 20 MB)" : "No se pudo subir la foto; probá de nuevo");
      try { await firmar([id]); } catch (_) { /* se firma después */ }
      return { id, url: window.tallerFoto(id), sizeBytes: listo.size, contentType: tipo };
    },
    async list() { return { assets: [], usage: {} }; },
  };

  const user = {
    async id() { return W.sesion?.user?.id || ""; },
    async can(n) { return n === "data.write" ? !!W.yo && W.yo.rol !== "lectura" : null; },
    async me() { return { id: W.sesion?.user?.id || "", name: W.yo?.nombre || "" }; },
    async profiles(ids) {
      const r = {};
      for (const id of ids || []) {
        const m = W.miembros.find((x) => x.id === id || (x.alias || []).includes(id));
        r[id] = { id, name: m?.nombre || "" };
      }
      return r;
    },
    isOwner: () => W.yo?.rol === "admin",
    canEdit: () => !!W.yo && W.yo.rol !== "lectura",
  };

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || "taller";
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60e3);
      return { ok: true };
    },
  };

  window.claude = {
    async use(n) {
      await window.tallerListo;
      if (n === "db") return db;
      if (n === "user") return user;
      if (n === "downloads") return downloads;
      if (n === "assets") return W.yo && W.yo.rol !== "lectura" ? assets : null;
      return null; // "Ideas escritas con Claude" no está en la versión web
    },
  };

  // ---------- Equipo ----------
  const MENSAJES = {
    mail: "Revisá el mail.", nombre: "Falta el nombre.", no_a_vos: "Tu propia cuenta no se cambia desde acá.",
    sin_sesion: "Tu sesión venció: volvé a entrar.", solo_admin: "Solo quien administra el taller puede hacer esto.",
    ya_hay_admin: "El taller ya tiene una cuenta de administración: entrá con tu mail.",
    datos: "Revisá el nombre y el mail.", no_existe: "No encontré a esa persona.",
  };
  async function funcion(accion, cuerpo = {}) {
    const { data, error } = await sb.functions.invoke("equipo", { body: { accion, ...cuerpo } });
    if (error) {
      let d = {};
      try { d = await error.context?.json?.(); } catch (_) { /* sin detalle */ }
      throw Object.assign(new Error(d?.error || error.message), { codigo: d?.error || "error", mensaje: MENSAJES[d?.error] || "No se pudo; probá de nuevo." });
    }
    return data;
  }
  const direccion = () => location.origin + location.pathname;
  async function salir() {
    try { localStorage.removeItem(LS_FOTOS); } catch (_) { /* nada */ }
    try { await sb.auth.signOut(); } catch (_) { /* nada */ }
    location.replace(direccion());
  }
  window.tallerWeb = {
    yo: () => W.yo,
    esAdmin: () => W.yo?.rol === "admin",
    miembros: () => W.miembros.slice(),
    direccion,
    alCambiar(f) { W.alCambiar.add(f); },
    async sumar(d) { const r = await funcion("sumar", d); await cargarMiembros(); return r; },
    async cambiar(email, cambios) { await funcion("cambiar", { email, ...cambios }); await cargarMiembros(); },
    salir,
  };

  // ---------- Pantalla para entrar: mail y código, sin contraseñas ----------
  const LARGO = Number(C.largoCodigo) || 6;
  function pantalla(html) {
    document.body.classList.add("con-acceso");
    let a = document.getElementById("acceso");
    if (!a) {
      a = document.createElement("div");
      a.id = "acceso";
      a.className = "acceso";
      document.body.append(a);
    }
    const logo = document.querySelector(".lateral .marca img")?.getAttribute("src") || "";
    a.innerHTML = `<div class="acceso-caja"><div class="marca"><img src="${esc(logo)}" alt="Santesteban"><span>Taller de diseño</span></div>${html}</div>`;
    setTimeout(() => a.querySelector("input")?.focus(), 30);
    return a;
  }
  function quitarPantalla() {
    document.getElementById("acceso")?.remove();
    document.body.classList.remove("con-acceso");
  }
  const esperando = (texto = "Abriendo el taller…") => pantalla(`<div class="acceso-form"><p class="acceso-ayuda">${esc(texto)}</p></div>`);

  function pantallaEntrar(aviso = "", email = "") {
    const a = pantalla(`<form class="acceso-form" data-acceso="mail" novalidate>
      <h1>Entrar</h1>
      <p>${aviso ? esc(aviso) : "Escribí tu mail y te mandamos un acceso directo: un mail con un botón para entrar."}</p>
      <label>Mail<input type="email" name="email" autocomplete="email" inputmode="email" value="${esc(email)}" required></label>
      <p class="acceso-error" role="alert"></p>
      <button class="btn prim" type="submit">Mandarme el acceso</button>
      <p class="acceso-ayuda oculto" id="primeraVez">Es la primera vez que se usa el taller: <a href="#" data-acceso-ir="primer">crear la cuenta de administración</a>.</p>
    </form>`);
    // Si todavía no hay ninguna cuenta, lo único que se puede hacer es crear la primera: vamos directo ahí.
    // Si el navegador no deja guardar nada, la sesión se pierde al recargar: lo avisamos
    if (!ALMACEN.ls.startsWith("ok") && !ALMACEN.cookies.startsWith("ok")) {
      a.querySelector(".acceso-form")?.insertAdjacentHTML("beforeend", `<p class="acceso-ayuda">Ojo: este navegador no deja que el taller guarde tu sesión, por eso te pide entrar cada vez. En Chrome: Configuración → Privacidad y seguridad → Cookies de terceros y datos de sitios → permití que los sitios guarden datos (o agregá ${esc(location.hostname)}).</p>`);
    }
    funcion("estado", { diag: { ...ALMACEN, ua: navigator.userAgent.slice(0, 160) } }).then((r) => {
      if (!r || r.hayMiembros || !a.querySelector("form[data-acceso='mail']")) return;
      pantallaPrimer(a.querySelector("input[name=email]")?.value || email, true);
    }).catch(() => {});
  }
  function pantallaPrimer(email = "", primeraVez = false) {
    pantalla(`<form class="acceso-form" data-acceso="primer" novalidate>
      <h1>Cuenta de administración</h1>
      <p>${primeraVez ? "Todavía no hay ninguna cuenta en el taller: empezá por la tuya. " : ""}Es la cuenta de quien maneja el taller: puede sumar personas y quitar accesos. Para entrar te mandamos un mail con un botón de acceso.</p>
      <label>Nombre<input type="text" name="nombre" maxlength="80" autocomplete="name" required></label>
      <label>Mail<input type="email" name="email" autocomplete="email" inputmode="email" value="${esc(email)}" required></label>
      <p class="acceso-error" role="alert"></p>
      <button class="btn prim" type="submit">Crear y mandarme el acceso</button>
      ${primeraVez ? "" : `<p class="acceso-ayuda"><a href="#" data-acceso-ir="entrar">Volver</a></p>`}
    </form>`);
  }
  let espera = null;
  function pantallaCodigo(email) {
    const a = pantalla(`<form class="acceso-form" data-acceso="codigo" data-email="${esc(email)}" novalidate>
      <h1>Revisá tu mail</h1>
      <p>Te mandamos un mail a <b>${esc(email)}</b>. Tocá <b>Entrar al taller</b> en ese mail y listo. Puede tardar un minuto; si no aparece, mirá en correo no deseado.</p>
      <p>Si lo abrís en otro aparato, escribí acá el código de ${LARGO} números que viene en el mismo mail.</p>
      <label>Código<input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="${LARGO}" required class="codigo"></label>
      <p class="acceso-error" role="alert"></p>
      <button class="btn prim" type="submit">Entrar</button>
      <p class="acceso-ayuda"><a href="#" data-acceso-ir="reenviar" id="reenviar">Mandarme otro mail</a> · <a href="#" data-acceso-ir="entrar">Usar otro mail</a></p>
    </form>`);
    const campo = a.querySelector("input[name=codigo]");
    campo.addEventListener("input", () => {
      campo.value = campo.value.replace(/\D/g, "").slice(0, LARGO);
      if (campo.value.length === LARGO) campo.form.requestSubmit();
    });
    // Para pedir otro código hay que esperar un minuto
    const link = a.querySelector("#reenviar");
    let falta = 60;
    clearInterval(espera);
    const tic = () => {
      link.textContent = falta > 0 ? `Mandarme otro mail (en ${falta} s)` : "Mandarme otro mail";
      link.classList.toggle("apagado", falta > 0);
      if (falta-- <= 0) clearInterval(espera);
    };
    tic();
    espera = setInterval(tic, 1000);
  }
  function pantallaSinAcceso(email) {
    pantalla(`<div class="acceso-form">
      <h1>Sin acceso</h1>
      <p>La cuenta ${esc(email || "")} no tiene acceso al taller. Pedile a quien lo administra que te sume.</p>
      <button class="btn" type="button" data-acceso-ir="salir">Salir</button>
    </div>`);
  }
  function pantallaError(e) {
    const detalle = [e?.code, e?.message].filter(Boolean).join(" · ");
    pantalla(`<div class="acceso-form">
      <h1>No se pudo abrir el taller</h1>
      <p>Revisá tu conexión y volvé a intentar. Si sigue sin abrir, avisale a quien administra el taller.</p>
      <button class="btn prim" type="button" data-acceso-ir="reintentar">Reintentar</button>
      ${detalle ? `<p class="acceso-ayuda">Detalle para quien administra: ${esc(detalle)}</p>` : ""}
    </div>`);
  }

  // Pide el código. Devuelve un texto de error para mostrar, o "" si salió bien.
  async function pedirCodigo(email) {
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: direccion() } });
    if (!error) return "";
    const m = `${error.code || ""} ${error.message || ""}`;
    if (/otp_disabled|signups? not allowed|not found|user_not_found/i.test(m)) return "Ese mail no tiene acceso al taller. Pedile a quien lo administra que te sume.";
    if (/rate|security purposes|seconds|too many/i.test(m)) return "Ya te mandamos un mail hace poco: esperá un minuto y probá de nuevo.";
    if (/banned/i.test(m)) return "Esta cuenta no tiene acceso al taller.";
    return "No se pudo mandar el mail; probá de nuevo en un rato.";
  }

  // Abre el taller con la sesión ya iniciada. Una sola vez a la vez, y con reintentos por si la red falla.
  let entrando = null;
  function continuar(sesion) {
    if (!entrando) entrando = abrirConSesion(sesion).finally(() => { entrando = null; });
    return entrando;
  }
  async function abrirConSesion(sesion) {
    esperando();
    let problema = null;
    for (let intento = 0; intento < 3; intento++) {
      try {
        // Primero me aseguro de que la sesión quedó guardada: si se piden datos antes, la base los niega.
        let { data } = await sb.auth.getSession();
        if (!data?.session && sesion?.access_token && sesion?.refresh_token) {
          await sb.auth.setSession({ access_token: sesion.access_token, refresh_token: sesion.refresh_token });
          ({ data } = await sb.auth.getSession());
        }
        W.sesion = data?.session || null;
        if (!W.sesion) { pantallaEntrar("Tu sesión no quedó guardada en este navegador. Pedí el acceso de nuevo."); return; }
        await cargarMiembros();
        if (!W.yo) { pantallaSinAcceso(W.sesion.user?.email); return; }
        suscribir();
        await cargarTodo();
        problema = null;
        break;
      } catch (e) {
        problema = e;
        console.error(e);
        await new Promise((r) => setTimeout(r, 800 * (intento + 1)));
      }
    }
    if (problema) { pantallaError(problema); return; }
    clearInterval(espera);
    quitarPantalla();
    abrirTaller();
    sb.rpc("marcar_ingreso").then(() => {}, () => {});
  }

  document.addEventListener("click", async (ev) => {
    const ir = ev.target.closest("[data-acceso-ir]");
    if (!ir) return;
    ev.preventDefault();
    const a = ir.dataset.accesoIr;
    if (a === "primer") pantallaPrimer();
    else if (a === "entrar") { clearInterval(espera); pantallaEntrar(); }
    else if (a === "salir") salir();
    else if (a === "reintentar") arrancar();
    else if (a === "reenviar") {
      if (ir.classList.contains("apagado")) return;
      const f = ir.closest("form");
      const err = f.querySelector(".acceso-error");
      const problema = await pedirCodigo(f.dataset.email);
      if (problema) err.textContent = problema;
      else pantallaCodigo(f.dataset.email);
    }
  });

  document.addEventListener("submit", async (ev) => {
    const f = ev.target.closest("form[data-acceso]");
    if (!f) return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    const d = new FormData(f);
    const err = f.querySelector(".acceso-error");
    const boton = f.querySelector("button[type=submit]");
    if (boton.disabled) return;
    const decir = (t) => { err.textContent = t; boton.disabled = false; };
    err.textContent = "";
    boton.disabled = true;
    const email = String(d.get("email") || f.dataset.email || "").trim().toLowerCase();
    try {
      if (f.dataset.acceso === "mail") {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return decir("Revisá el mail.");
        const problema = await pedirCodigo(email);
        if (problema) return decir(problema);
        pantallaCodigo(email);
        return;
      }
      if (f.dataset.acceso === "primer") {
        const nombre = String(d.get("nombre") || "").trim();
        if (!nombre || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return decir("Completá tu nombre y tu mail.");
        try { await funcion("primer_admin", { nombre, email }); } catch (e) { return decir(e.mensaje || "No se pudo crear la cuenta."); }
        const problema = await pedirCodigo(email);
        if (problema) return decir(problema);
        pantallaCodigo(email);
        return;
      }
      if (f.dataset.acceso === "codigo") {
        const codigo = String(d.get("codigo") || "").replace(/\D/g, "");
        if (codigo.length !== LARGO) return decir(`El código tiene ${LARGO} números.`);
        const { data, error } = await sb.auth.verifyOtp({ email, token: codigo, type: "email" });
        if (error || !data?.session) {
          const m = String(error?.message || "");
          return decir(/banned/i.test(m) ? "Esta cuenta no tiene acceso al taller." : "El código no es correcto o ya venció. Revisalo, o pedí otro.");
        }
        await continuar(data.session);
      }
    } catch (e) {
      console.error(e);
      decir("No se pudo; revisá tu conexión y probá de nuevo.");
    }
  }, true);

  // Si se cierra la sesión (desde Salir o porque se quitó el acceso), vuelve a la entrada.
  // Si alguien llega con el link del mail en vez del código, "arrancar" ya toma esa sesión.
  sb.auth.onAuthStateChange((evento, sesion) => {
    if (evento === "SIGNED_OUT" && W.yo) location.replace(direccion());
    if (evento === "SIGNED_IN" && sesion && !W.yo && !entrando && document.querySelector("form[data-acceso='codigo']")) {
      setTimeout(() => continuar(sesion), 300);
    }
  });

  async function arrancar() {
    esperando();
    let sesion = null;
    try { ({ data: { session: sesion } } = await sb.auth.getSession()); } catch (_) { /* sin sesión */ }
    if (location.hash.includes("access_token") || location.hash.includes("error")) history.replaceState(null, "", direccion() + location.search);
    if (!sesion) { pantallaEntrar(); return; }
    await continuar(sesion);
  }
  document.body.classList.add("con-acceso");
  arrancar();
})();
</script>

<script>
(() => {
  const TEMPORADAS = ["Invierno", "Verano", "Otoño", "Primavera", "Todo el año"];
  const ESTADO = { propuesta: "Para revisar", guardada: "Aceptado", descartada: "Rechazado" };
  const TIPOS_MANUAL = { gusta: "Le gusta", no: "No le gusta", regla: "Regla" };
  const ETIQUETA = {
    subida: "Modelo subido", propuesta: "Versión nueva", guardada: "Aceptado", descartada: "Rechazado",
    revisar: "Vuelve a revisión", pedido: "Pedido de versión", pedido_hecho: "Pedido dibujado", gusto: "Cerebro",
    ideas: "Ideas de Claude", nota: "Nota"
  };
  const S = {
    proyectos: [], versiones: [], historial: [], gusto: [], pedidos: [], ideas: [],
    listos: new Set(), tab: "taller", sel: null, filtro: "propuesta", hEstado: "todos", hModelo: "", hVista: "disenos",
    db: null, assets: null, user: null, sample: null, downloads: null, yo: "", puede: null, nombres: {}, cargaFallo: false
  };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const foto = (id) => (!id ? "" : window.tallerFoto ? window.tallerFoto(id) : "/_blob/" + encodeURIComponent(id));
  const ahora = () => new Date().toISOString();
  const fecha = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("es-AR", { day: "numeric", month: "short" });
  };
  const porFecha = (a, b) => String(b.creado || "").localeCompare(String(a.creado || ""));
  const proyecto = (id) => S.proyectos.find((p) => p.id === id);
  const version = (id) => S.versiones.find((v) => v.id === id);
  // Quién dibuja: en la versión web, el dibujante automático; en el taller de Claude, Claude.
  const AUTO = !!window.TALLER_CONFIG;
  const DIBUJA = AUTO ? "el dibujante automático" : "Claude";
  const estadoPedido = (x) => x.estado === "hecho" ? "Dibujado"
    : x.estado === "en_proceso" ? (AUTO ? "Dibujando…" : "Claude lo está dibujando")
    : x.estado === "en_cola" ? "Sigue más tarde"
    : x.estado === "error" ? "No se pudo dibujar"
    : (AUTO ? "En cola" : "Esperando a Claude");
  const explicaPedido = (x) => x.estado === "en_proceso"
      ? (AUTO ? "El dibujante automático lo está dibujando. En uno o dos minutos las versiones aparecen en el Taller, en «Para revisar»." : "Claude ya lo está dibujando. Cuando termine, las versiones aparecen en el Taller, en «Para revisar».")
    : x.estado === "en_cola" ? (x.nota || "Se terminó el cupo gratis de imágenes de hoy: sigue solo más tarde.")
    : x.estado === "error" ? `No se pudo dibujar${x.nota ? ": " + x.nota : ""}. Podés reintentarlo.`
    : (AUTO ? "Empieza en un momento: el dibujante automático toma los pedidos solo." : "Todavía no empezó: se dibuja cuando Joaquín le escribe a Claude «hay pedidos en el taller».");
  const quien = (id) => {
    if (!id) return "";
    if (id === "claude") return "Claude";
    if (id === "auto") return "Dibujante automático";
    if (id === "chat") return "Joaquín, por chat";
    return S.nombres[id] || "Alguien del equipo";
  };
  const persona = (id) => (id ? `<span data-uid="${esc(id)}">${esc(quien(id))}</span>` : "");
  const claseTemp = (t) => (String(t || "").toLowerCase().startsWith("invierno") ? "invierno" : String(t || "").toLowerCase().startsWith("verano") ? "verano" : "");
  const escribe = () => !!S.db && S.puede !== false;
  const proyectosOrdenados = () => [...S.proyectos].sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || porFecha(a, b));
  const ordenVersiones = (a, b) => (b.ronda || 0) - (a.ronda || 0) || porFecha(a, b);

  // El cerebro: lo que se explicó al aceptar o rechazar cada diseño, más lo anotado a mano.
  function cerebro() {
    const deDiseno = (estado) => S.versiones.filter((v) => v.estado === estado && v.motivo).sort((a, b) => String(b.decidido || b.creado || "").localeCompare(String(a.decidido || a.creado || "")));
    const manual = (tipo) => S.gusto.filter((g) => g.tipo === tipo).sort(porFecha);
    return { si: deDiseno("guardada"), no: deDiseno("descartada"), siManual: manual("gusta"), noManual: manual("no"), reglas: manual("regla") };
  }

  let tMsg;
  function avisar(texto) {
    const m = $("#mensaje");
    m.textContent = texto;
    m.classList.add("visible");
    clearTimeout(tMsg);
    tMsg = setTimeout(() => m.classList.remove("visible"), 3200);
  }

  // ---------- Dibujo ----------
  let pendiente = false;
  function render() {
    if (pendiente) return;
    pendiente = true;
    setTimeout(() => { pendiente = false; dibujar(); }, 16);
  }

  function dibujar() {
    document.body.dataset.seccion = S.tab;
    document.querySelectorAll(".menu button[data-tab]").forEach((b) => {
      if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    const pend = S.pedidos.filter((p) => p.estado !== "hecho").length;
    const nP = $("#nPedidos"); nP.textContent = pend; nP.classList.toggle("oculto", !pend);
    const rev = S.versiones.filter((v) => v.estado === "propuesta").length;
    const nR = $("#nRevisar"); nR.textContent = rev; nR.classList.toggle("oculto", !rev);
    $("#botonSubir").classList.toggle("oculto", !(S.assets && escribe()));
    const web = window.tallerWeb;
    $("#menuEquipo").classList.toggle("oculto", !web?.esAdmin());
    $("#cuenta").classList.toggle("oculto", !web?.yo());
    if (web?.yo()) $("#cuentaNombre").textContent = web.yo().nombre;
    if (S.tab === "equipo" && !web?.esAdmin()) S.tab = "taller";
    dibujarModelos();
    const vista = $("#vista");
    if (!S.db) {
      vista.innerHTML = S.cargaFallo
        ? (web
          ? `<div class="aviso"><strong>No se pudo abrir la base del taller.</strong> Revisá tu conexión y recargá la página.</div>`
          : `<div class="aviso"><strong>No se pudo abrir la base del taller.</strong> Abrí esta página desde claude.ai con tu sesión iniciada para ver los modelos, los diseños y el historial.</div>`)
        : `<div class="aviso">Cargando el taller…</div>`;
      return;
    }
    if (S.listos.size < 6) { vista.innerHTML = `<div class="aviso">Cargando el taller…</div>`; return; }
    vista.innerHTML = S.tab === "historial" ? vHistorial() : S.tab === "cerebro" ? vCerebro() : S.tab === "pedidos" ? vPedidos() : S.tab === "equipo" ? vEquipo() : vTaller();
    resolverNombres();
  }

  function dibujarModelos() {
    const ps = proyectosOrdenados();
    if (!S.sel || !proyecto(S.sel)) S.sel = ps[0]?.id || null;
    $("#listaModelos").innerHTML = ps.map((p) => {
      const r = S.versiones.filter((v) => v.proyecto === p.id && v.estado === "propuesta").length;
      const prod = S.pedidos.filter((x) => x.proyecto === p.id && x.estado !== "hecho").length;
      return `<button class="modelo" data-accion="elegir" data-id="${esc(p.id)}" aria-current="${S.tab === "taller" && p.id === S.sel}">
        ${p.original ? `<img src="${foto(p.original)}" alt="" loading="lazy">` : `<div class="sinfoto"></div>`}
        <span><b>${esc(p.nombre)}</b><small>${r ? `${r} para revisar` : "Todo revisado"}${prod ? ` · ${prod} en producción` : ""}</small></span>
      </button>`;
    }).join("") || (S.listos.size >= 6 ? `<p class="estado" style="padding:0 10px">Todavía no hay modelos.</p>` : "");
  }

  function vTaller() {
    const p = proyecto(S.sel);
    if (!p) return `<div class="cabeza"><h1>Taller</h1><p>Subí la foto de una cartera para empezar a transformarla al estilo Santesteban.</p></div>
      ${S.assets && escribe() ? `<button class="btn prim" data-accion="nuevoModelo">Subir un modelo</button>` : `<div class="aviso">Para subir modelos hace falta permiso de edición en esta página.</div>`}`;
    const vs = S.versiones.filter((v) => v.proyecto === p.id).sort(ordenVersiones);
    const cuenta = { propuesta: 0, guardada: 0, descartada: 0, todas: vs.length };
    vs.forEach((v) => { if (cuenta[v.estado] !== undefined) cuenta[v.estado]++; });
    const filtradas = vs.filter((v) => S.filtro === "todas" || v.estado === S.filtro);
    const pedidosP = S.pedidos.filter((x) => x.proyecto === p.id && x.estado !== "hecho").sort(porFecha);
    const enProduccion = S.filtro === "propuesta" || S.filtro === "todas" ? pedidosP.map((x) => {
      const base = x.version ? version(x.version) : null;
      const img = base?.imagen || p.original;
      return `<button class="tarjeta en-produccion" data-accion="verPedido" data-id="${esc(x.id)}">
        <div class="foto">${img ? `<img src="${foto(img)}" alt="" loading="lazy">` : ""}<span class="sello">${x.estado === "error" ? "No se pudo dibujar" : "En producción"}<small>${esc(estadoPedido(x))}</small></span></div>
        <div class="texto"><b>${esc(x.texto)}</b><p>Pedido el ${esc(fecha(x.creado))}${x.quien ? ` · ${persona(x.quien)}` : ""}</p></div>
      </button>`;
    }).join("") : "";
    const ideas = S.ideas.filter((i) => i.proyecto === p.id).sort(porFecha);
    const botones = escribe() ? `
      <button class="btn prim" data-accion="pedirVersiones">Pedir versiones nuevas</button>
      ${S.sample ? `<button class="btn" data-accion="ideas">Ideas escritas con Claude</button>` : ""}
      <button class="btn" data-accion="editarModelo">Editar datos</button>` : "";
    const filtro = (k, t) => `<button data-accion="filtro" data-f="${k}" aria-pressed="${S.filtro === k}">${t} · ${cuenta[k]}</button>`;
    const tarjetas = filtradas.map((v) => `
      <button class="tarjeta ${esc(v.estado)}" data-accion="abrir" data-id="${esc(v.id)}">
        <div class="foto">${v.imagen ? `<img src="${foto(v.imagen)}" alt="${esc(v.nombre)}" loading="lazy" decoding="async">` : ""}</div>
        <div class="texto"><b>${esc(v.nombre)}</b><p>${esc(v.estado !== "propuesta" && v.motivo ? v.motivo : v.descripcion || "")}</p>
          <div class="fila"><span class="chip ${esc(v.estado)}">${esc(ESTADO[v.estado] || v.estado)}</span>${v.ronda ? `<span class="chip">Ronda ${esc(v.ronda)}</span>` : ""}</div>
        </div>
      </button>`).join("");
    const vacio = S.filtro === "propuesta"
      ? `<div class="vacio">No hay diseños para revisar.${pedidosP.length ? ` Hay ${pedidosP.length} pedido${pedidosP.length > 1 ? "s" : ""} en producción.` : ""}</div>`
      : `<div class="vacio">No hay diseños en esta lista.</div>`;
    return `
      <div class="ficha">
        <button class="original" data-accion="verOriginal" aria-label="Ver el modelo original">${p.original ? `<img src="${foto(p.original)}" alt="Modelo original">` : ""}</button>
        <div>
          <div class="fila"><span class="chip ${claseTemp(p.temporada)}">${esc(p.temporada || "Sin temporada")}</span>${pedidosP.length ? `<span class="chip pendiente">${pedidosP.length} en producción</span>` : ""}</div>
          <h1>${esc(p.nombre)}</h1>
          <dl>
            <dt>Se conserva</dt><dd>${esc(p.conservar || "Solo la forma y el tamaño")}</dd>
            ${p.notas ? `<dt>Notas</dt><dd>${esc(p.notas)}</dd>` : ""}
            <dt>Subido</dt><dd>${esc(fecha(p.creado))}${p.creadoPor ? ` · ${persona(p.creadoPor)}` : ""}</dd>
          </dl>
          <div class="acciones">${botones}</div>
        </div>
      </div>
      <div class="filtros" role="group" aria-label="Filtrar diseños">${filtro("propuesta", "Para revisar")}${filtro("guardada", "Aceptados")}${filtro("descartada", "Rechazados")}${filtro("todas", "Todos")}</div>
      ${filtradas.length || enProduccion ? `<div class="grilla">${enProduccion}${tarjetas}</div>` : vacio}
      <div id="zonaIdeas">${ideas.length ? vIdeas(ideas) : ""}</div>`;
  }

  function vIdeas(ideas) {
    return `<div class="seccion"><span class="etiqueta">Ideas escritas con Claude</span><div class="ideas">${ideas.map((i) => `
      <div class="idea"><b>${esc(i.nombre)}</b><p>${esc(i.idea)}</p>
        ${i.materiales?.length ? `<small>${esc(i.materiales.join(" · "))}</small>` : ""}
        ${i.por_que ? `<small><em>${esc(i.por_que)}</em></small>` : ""}
        ${escribe() ? `<div class="fila"><button class="btn chico" data-accion="ideaAPedido" data-id="${esc(i.id)}">Pedir que la dibuje</button><button class="quitar" title="Borrar idea" aria-label="Borrar idea" data-accion="borrarIdea" data-id="${esc(i.id)}">×</button></div>` : ""}
      </div>`).join("")}</div></div>`;
  }

  function vHistorial() {
    const ps = proyectosOrdenados();
    const todas = S.versiones.filter((v) => !S.hModelo || v.proyecto === S.hModelo);
    const n = { propuesta: 0, guardada: 0, descartada: 0 };
    todas.forEach((v) => { if (n[v.estado] !== undefined) n[v.estado]++; });
    const opciones = `<option value="">Todos los modelos</option>` + ps.map((p) => `<option value="${esc(p.id)}" ${p.id === S.hModelo ? "selected" : ""}>${esc(p.nombre)}</option>`).join("");
    const chip = (k, t) => `<button data-accion="hEstado" data-f="${k}" aria-pressed="${S.hEstado === k}">${t}</button>`;
    const cabeza = `<div class="cabeza"><h1>Historial</h1><p>Cada diseño con su estado. Al aceptar o rechazar uno, se escribe por qué: esa explicación pasa sola al cerebro de la diseñadora.</p></div>
      <div class="resumen">
        <div class="dato pe"><b>${n.propuesta}</b><span>para revisar</span></div>
        <div class="dato ok"><b>${n.guardada}</b><span>aceptados</span></div>
        <div class="dato no"><b>${n.descartada}</b><span>rechazados</span></div>
      </div>
      <div class="filtros">
        <div class="vistas" role="group" aria-label="Qué ver"><button data-accion="hVista" data-f="disenos" aria-pressed="${S.hVista === "disenos"}">Diseños</button><button data-accion="hVista" data-f="movimientos" aria-pressed="${S.hVista === "movimientos"}">Movimientos</button></div>
        <select data-accion="hModelo" aria-label="Filtrar por modelo">${opciones}</select>
        ${S.hVista === "disenos" ? chip("todos", "Todos") + chip("propuesta", "Para revisar") + chip("guardada", "Aceptados") + chip("descartada", "Rechazados") : ""}
      </div>`;
    if (S.hVista === "movimientos") return cabeza + vMovimientos();
    const grupos = ps.filter((p) => !S.hModelo || p.id === S.hModelo).map((p) => {
      const vs = S.versiones.filter((v) => v.proyecto === p.id && (S.hEstado === "todos" || v.estado === S.hEstado)).sort(ordenVersiones);
      if (!vs.length) return "";
      return `<section class="grupo"><h2>${p.original ? `<img src="${foto(p.original)}" alt="">` : ""}${esc(p.nombre)} <small>${vs.length} diseño${vs.length === 1 ? "" : "s"}</small></h2>
        <div class="registros">${vs.map(registro).join("")}</div></section>`;
    }).join("");
    return cabeza + (grupos || `<div class="vacio" style="margin-top:20px">No hay diseños con ese filtro.</div>`);
  }

  function registro(v) {
    const decidido = v.estado !== "propuesta";
    const porque = decidido
      ? (v.motivo ? `<p class="porque"><em>${v.estado === "guardada" ? "Por qué sí:" : "Por qué no:"}</em> ${esc(v.motivo)}</p>` : `<p class="porque" style="color:var(--mu)">Falta escribir por qué.</p>`)
      : `<p class="porque" style="color:var(--mu)">Todavía sin decidir.</p>`;
    const cuando = decidido && v.decidido ? `<small>${esc(ESTADO[v.estado])} el ${esc(fecha(v.decidido))}${v.decidioPor ? ` · ${persona(v.decidioPor)}` : ""}</small>`
      : `<small>Propuesto el ${esc(fecha(v.creado))}${v.autor ? ` · ${persona(v.autor)}` : ""}</small>`;
    const acciones = !escribe() ? "" : decidido
      ? `<div class="acciones"><button class="btn chico" data-accion="decidir" data-id="${esc(v.id)}" data-estado="${esc(v.estado)}">Cambiar o explicar</button></div>`
      : `<div class="acciones"><button class="btn chico ok" data-accion="decidir" data-id="${esc(v.id)}" data-estado="guardada">Aceptar</button><button class="btn chico no" data-accion="decidir" data-id="${esc(v.id)}" data-estado="descartada">Rechazar</button></div>`;
    return `<article class="registro ${esc(v.estado)}">
      <button class="foto" data-accion="abrir" data-id="${esc(v.id)}" aria-label="Ver ${esc(v.nombre)}">${v.imagen ? `<img src="${foto(v.imagen)}" alt="" loading="lazy">` : ""}</button>
      <div><div class="fila"><b>${esc(v.nombre)}</b><span class="chip ${esc(v.estado)}">${esc(ESTADO[v.estado] || v.estado)}</span>${v.ronda ? `<span class="chip">Ronda ${esc(v.ronda)}</span>` : ""}</div>
        ${porque}${cuando}</div>
      ${acciones}
    </article>`;
  }

  function vMovimientos() {
    const ev = S.historial.filter((e) => !S.hModelo || e.proyecto === S.hModelo).sort(porFecha);
    const filas = ev.map((e) => {
      const v = e.version ? version(e.version) : null;
      const p = proyecto(e.proyecto);
      const img = v?.imagen || (e.tipo === "subida" ? p?.original : "");
      return `<div class="evento">
        <time datetime="${esc(e.creado)}">${esc(fecha(e.creado))}</time>
        <div class="que"><div class="fila"><span class="chip ${esc(e.tipo === "pedido" ? "pendiente" : e.tipo)}">${esc(ETIQUETA[e.tipo] || e.tipo)}</span>${p ? `<span class="chip">${esc(p.nombre)}</span>` : ""}</div>
          <span>${v ? `<b>${esc(v.nombre)}</b>${e.texto ? ": " : ""}` : ""}${esc(e.texto || "")}</span>
          ${e.quien ? `<span class="quien">${persona(e.quien)}</span>` : ""}</div>
        ${img ? `<img src="${foto(img)}" alt="" loading="lazy" ${v ? `data-accion="abrir" data-id="${esc(v.id)}"` : ""}>` : `<span></span>`}
      </div>`;
    }).join("");
    return ev.length ? `<div class="linea">${filas}</div>` : `<div class="vacio">Todavía no hay movimientos.</div>`;
  }

  function vCerebro() {
    const c = cerebro();
    const item = (v) => {
      const p = proyecto(v.proyecto);
      return `<li><span>${esc(v.motivo)}</span><span></span>
        <span class="prueba">${v.imagen ? `<img src="${foto(v.imagen)}" alt="" data-accion="abrir" data-id="${esc(v.id)}">` : ""}<span>De <a data-accion="abrir" data-id="${esc(v.id)}">${esc(v.nombre)}</a>${p ? ` · ${esc(p.nombre)}` : ""}${v.decidido ? ` · ${esc(fecha(v.decidido))}` : ""}</span></span></li>`;
    };
    const manual = (g) => `<li><span>${esc(g.texto)}</span>${escribe() ? `<button class="quitar" data-accion="borrarGusto" data-id="${esc(g.id)}" aria-label="Quitar" title="Quitar">×</button>` : "<span></span>"}
      <span class="prueba"><span>Anotado a mano · ${esc(fecha(g.creado))}${g.quien ? ` · ${persona(g.quien)}` : ""}</span></span></li>`;
    const vacio = (t) => `<li><span style="color:var(--mu)">${t}</span></li>`;
    const agregar = escribe() ? `<form class="agregar" data-form="gusto">
        <select name="tipo" aria-label="Tipo">${Object.entries(TIPOS_MANUAL).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select>
        <input type="text" name="texto" placeholder="Ej.: prefiere herrajes en dorado envejecido" aria-label="Qué anotar" required maxlength="300">
        <button class="btn prim" type="submit">Anotar</button></form>` : "";
    return `<div class="cabeza"><h1>Cerebro de la diseñadora</h1><p>Lo que fuimos aprendiendo de su gusto. Se actualiza solo con cada diseño aceptado o rechazado en el Historial, y se puede sumar algo a mano. ${AUTO ? "El dibujante automático" : "Claude"} lo lee antes de dibujar cada versión nueva.</p></div>
      <div class="cerebro">
        <div class="columna si"><h3>Le gusta <small>${c.si.length + c.siManual.length}</small></h3><p>De los diseños aceptados</p><ul>${c.si.map(item).join("")}${c.siManual.map(manual).join("")}${!c.si.length && !c.siManual.length ? vacio("Todavía nada.") : ""}</ul></div>
        <div class="columna no"><h3>No le gusta <small>${c.no.length + c.noManual.length}</small></h3><p>De los diseños rechazados</p><ul>${c.no.map(item).join("")}${c.noManual.map(manual).join("")}${!c.no.length && !c.noManual.length ? vacio("Todavía nada.") : ""}</ul></div>
        <div class="columna reglas"><h3>Reglas <small>${c.reglas.length}</small></h3><p>Criterios fijos para cualquier modelo</p><ul>${c.reglas.map(manual).join("") || vacio("Todavía nada.")}</ul></div>
      </div>
      ${agregar}
      <p class="estado" style="margin-top:12px">Para corregir algo que vino de un diseño, cambiá su explicación en el Historial.</p>`;
  }

  function vPedidos() {
    const fila = (x) => {
      const p = proyecto(x.proyecto);
      const v = x.version ? version(x.version) : null;
      const img = v?.imagen || p?.original;
      const hechos = (x.resultado || []).map((id) => version(id)).filter(Boolean);
      return `<div class="pedido">${img ? `<img src="${foto(img)}" alt="" loading="lazy">` : `<div class="sinfoto"></div>`}
        <div><div class="fila"><span class="chip ${x.estado === "hecho" ? "guardada" : x.estado === "error" ? "descartada" : "pendiente"}">${esc(estadoPedido(x))}</span>${p ? `<span class="chip">${esc(p.nombre)}</span>` : ""}${v ? `<span class="chip">sobre ${esc(v.nombre)}</span>` : ""}</div>
          <p>${esc(x.texto)}</p>
          ${x.estado !== "hecho" ? `<p class="estado">${esc(explicaPedido(x))}</p>` : ""}
          <small class="quien">${esc(fecha(x.creado))}${x.quien ? ` · ${persona(x.quien)}` : ""}${hechos.length ? ` · ${AUTO ? "Se dibujó" : "Claude subió"}: ${hechos.map((h) => esc(h.nombre)).join(", ")}` : ""}</small></div>
        <div class="acciones">${p ? `<button class="btn chico" data-accion="irAModelo" data-id="${esc(p.id)}">Ver modelo</button>` : ""}${AUTO && escribe() && (x.estado === "error" || x.estado === "en_cola") ? `<button class="btn chico" data-accion="reintentarPedido" data-id="${esc(x.id)}">Reintentar</button>` : ""}${escribe() && x.estado !== "hecho" ? `<button class="quitar" data-accion="borrarPedido" data-id="${esc(x.id)}" aria-label="Cancelar pedido" title="Cancelar pedido">×</button>` : ""}</div></div>`;
    };
    const pend = S.pedidos.filter((x) => x.estado !== "hecho").sort(porFecha);
    const hechos = S.pedidos.filter((x) => x.estado === "hecho").sort(porFecha);
    const ps = proyectosOrdenados();
    const nuevo = escribe() && ps.length ? `<form class="nuevo-pedido" data-form="pedidoLibre">
        <select name="proyecto" aria-label="Modelo">${ps.map((p) => `<option value="${esc(p.id)}" ${p.id === S.sel ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select>
        <textarea name="texto" required maxlength="800" aria-label="Qué querés que dibuje" placeholder="Ej.: la Tote en bordó, con la franja de chaguar más angosta"></textarea>
        <button class="btn prim" type="submit">Pedir</button></form>` : "";
    return `<div class="cabeza"><h1>Pedidos de versiones</h1>${AUTO ? `<p>Los diseños nuevos que pide el equipo. El dibujante automático los toma solos y propone versiones siguiendo el cerebro de la diseñadora.</p></div>
      <div class="pasos">
        <div class="paso"><span class="num">1</span><b>Se pide</b><p>Al subir un modelo, con «Pedir versiones nuevas», con «Pedir un cambio» en un diseño, o acá abajo.</p></div>
        <div class="paso"><span class="num">2</span><b>Se dibuja solo</b><p>En uno o dos minutos aparecen versiones nuevas. El plan gratis alcanza para unas 6 imágenes por día; si se termina, sigue solo más tarde.</p></div>
        <div class="paso"><span class="num">3</span><b>Se revisa</b><p>Las versiones aparecen en el Taller, en «Para revisar». Aceptarlas o rechazarlas con el porqué alimenta el cerebro.</p></div>
      </div>` : `<p>La lista de diseños nuevos que el equipo le pide a Claude. La página no puede dibujar carteras sola: anota el pedido y Claude lo dibuja.</p></div>
      <div class="pasos">
        <div class="paso"><span class="num">1</span><b>Se pide</b><p>Con «Pedir un cambio» en un diseño, «Pedir versiones nuevas» en un modelo, o acá abajo.</p></div>
        <div class="paso"><span class="num">2</span><b>Queda anotado</b><p>Aparece en esta lista como «esperando a Claude», con el modelo y lo que se pidió. La página no lo dibuja sola.</p></div>
